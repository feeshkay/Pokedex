/* ---------------- Pokémon artwork (official art, hotlinked — never stored locally) ---------------- */
function speciesImageUrl(s){
  if(!s || !s.dex || typeof s.dex !== 'number') return null;
  return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${s.dex}.png`;
}
// Wrapper + fallback icon behind the <img>; if the artwork 404s (e.g. species
// too new for the sprite repo) the broken image just hides and the icon shows.
function speciesImgTag(s, cls){
  const url = speciesImageUrl(s);
  return `<div class="imgwrap ${cls||''}">
    <div class="imgfallback">${ICONS.photo}</div>
    ${url ? `<img src="${url}" alt="${esc(s.name)}" loading="lazy" onerror="this.style.display='none'">` : ''}
  </div>`;
}
// Category › Subcategory, skipping any level that's just "—".
function taxBreadcrumb(s){
  if(!s) return '';
  const parts = [s.category];
  if(s.subcategory && s.subcategory!=='—') parts.push(s.subcategory);
  return parts.join(' › ');
}

function persist(part){
  if(part==='collection') saveJSON(LS_KEYS.collection, STATE.collection);
  else if(part==='picks') saveJSON(LS_KEYS.picks, STATE.picks);
  else if(part==='history') saveJSON(LS_KEYS.history, STATE.history);
  else if(part==='overrides') saveJSON(LS_KEYS.overrides, STATE.overrides);
  else if(part==='settings') saveJSON(LS_KEYS.settings, STATE.settings);
  else if(part==='labelOverrides') saveJSON(LS_KEYS.labelOverrides, STATE.labelOverrides);
  else if(part==='mergedLabels') saveJSON(LS_KEYS.mergedLabels, STATE.mergedLabels);
  else if(part==='categoryOverrides') saveJSON(LS_KEYS.categoryOverrides, STATE.categoryOverrides);
  else if(part==='manualOwned') saveJSON(LS_KEYS.manualOwned, STATE.manualOwned);
  else if(part==='taxonomy') saveJSON(LS_KEYS.taxonomy, STATE.taxonomy);
  else if(part==='familyOverrides') saveJSON(LS_KEYS.familyOverrides, STATE.familyOverrides);
  else if(part==='customSpecies') saveJSON(LS_KEYS.customSpecies, STATE.customSpecies);
  else if(part==='collectrSnapshot') saveJSON(LS_KEYS.collectrSnapshot, STATE.collectrSnapshot);
  else if(part==='removedInApp') saveJSON(LS_KEYS.removedInApp, STATE.removedInApp);
  // Push to the cloud (if connected) whenever real data changes. Settings
  // writes are excluded so that pushToCloud() recording its own
  // lastPushedAt timestamp (a settings write) can't trigger itself again.
  if(part!=='settings' && STATE.settings.cloudSync && STATE.settings.cloudSync.enabled){ cloudDirty = true; scheduleCloudPush(); }
}

/* ---------------- derived collection stats (recomputed on demand, cheap) ---------------- */
function collectionStats(){
  let totalCards=0, totalValue=0, costTotal=0;
  const speciesOwned = new Set();
  const setsSeen = new Set();
  for(const c of STATE.collection){
    totalCards += c.quantity;
    totalValue += (c.marketPrice||0) * c.quantity;
    costTotal += (c.costPaid||0) * c.quantity;
    if(c.species) speciesOwned.add(c.species);
    if(c.set) setsSeen.add(c.set);
  }
  Object.keys(STATE.manualOwned).forEach(nm => speciesOwned.add(nm));
  const totalSpecies = SPECIES.length;
  const binderPickCount = Object.keys(STATE.picks).length;
  return {
    totalCards, totalValue, costTotal,
    uniqueSpecies: speciesOwned.size,
    totalSpecies,
    collectionPct: totalSpecies ? (speciesOwned.size/totalSpecies*100) : 0,
    binderPct: totalSpecies ? (binderPickCount/totalSpecies*100) : 0,
    binderPickCount,
    setsCount: setsSeen.size,
    speciesOwnedSet: speciesOwned,
  };
}

function cardsForSpecies(name){
  return STATE.collection.filter(c => c.species === name);
}
// The specific card record chosen as a species' main-binder pick, if any —
// used to surface that card's set/number on its binder pocket.
function pickedCardFor(name){
  const id = STATE.picks[name];
  if(!id) return null;
  return STATE.collection.find(c => c.id === id) || null;
}
function speciesOwnedQty(name){
  return cardsForSpecies(name).reduce((s,c)=>s+c.quantity,0);
}
// Whether a species should show as "owned" anywhere in the app — either a
// real card is logged for it, or it's been manually marked (the workaround
// for species whose imported cards didn't name-match during CSV import,
// which happens most often with regional-variant cards).
function isOwned(name){
  return speciesOwnedQty(name) > 0 || !!STATE.manualOwned[name];
}
function toggleManualOwned(name){
  if(STATE.manualOwned[name]) delete STATE.manualOwned[name];
  else STATE.manualOwned[name] = true;
  persist('manualOwned');
  render();
}

/* For any species that owns exactly one distinct card (any quantity) and has
   no binder pick set yet, auto-set that card as the pick — there's nothing
   to choose between. Never overwrites a pick you already made. Call this
   after anything that can change how many distinct cards a species owns:
   import, manual add, delete, or a card's species being reassigned. Returns
   the set of species names it actually changed. */
function autoAssignSinglePicks(onlySpecies){
  const bySpecies = new Map();
  STATE.collection.forEach(c => {
    if(!c.species) return;
    if(onlySpecies && !onlySpecies.has(c.species)) return;
    if(!bySpecies.has(c.species)) bySpecies.set(c.species, []);
    bySpecies.get(c.species).push(c);
  });
  const changed = new Set();
  bySpecies.forEach((cards, species) => {
    if(cards.length === 1 && !STATE.picks[species]){
      STATE.picks[species] = cards[0].id;
      changed.add(species);
    }
  });
  if(changed.size) persist('picks');
  return changed;
}

/* Species with 2+ distinct card records and no binder pick set — the app
   can't guess which one belongs in the main binder, so these need a person
   to choose. Optionally scoped to a set of species names (e.g. just the ones
   an import touched). */
function speciesNeedingPickReconciliation(onlySpecies){
  const bySpecies = new Map();
  STATE.collection.forEach(c => {
    if(!c.species) return;
    if(onlySpecies && !onlySpecies.has(c.species)) return;
    if(!bySpecies.has(c.species)) bySpecies.set(c.species, []);
    bySpecies.get(c.species).push(c);
  });
  const out = [];
  bySpecies.forEach((cards, species) => {
    if(cards.length >= 2 && !STATE.picks[species]) out.push(species);
  });
  return out.sort((a,b)=>a.localeCompare(b));
}

/* Cards that share a species + set + card number but differ in variance
   (e.g. "Holofoil" vs "Normal") — usually the same physical card logged
   twice by Collectr rather than two different cards. Returns a Map from
   cardId to the other card(s) in its group, for flagging in the collection
   list. */
function redDotHTML(){ return '<span class="reddot" role="img" aria-label="needs attention"></span>'; }

/* ---- Collectr vs app: what each side still has that the other doesn't ---- */
function recordAppRemovals(cards){
  let any = false;
  cards.forEach(c => { if(c && c.importBatch){ STATE.removedInApp[c.id] = { removedAt:new Date().toISOString(), card:c }; any = true; } });
  if(any) persist('removedInApp');
}
function collectrDiscrepancies(){
  const snap = STATE.collectrSnapshot;
  if(!snap || !Array.isArray(snap.ids)) return { hasSnapshot:false, snapshot:null, inAppOnly:[], inCollectrOnly:[] };
  const ids = new Set(snap.ids);
  // cards that came from Collectr, aren't in its latest export, and you haven't said to keep
  const inAppOnly = STATE.collection.filter(c => c.importBatch && !c.keepInApp && !ids.has(c.id));
  // cards you removed here that its latest export still lists
  const here = new Set(STATE.collection.map(c => c.id));
  const inCollectrOnly = Object.keys(STATE.removedInApp).filter(id => ids.has(id) && !here.has(id)).map(id => ({ id, removedAt:STATE.removedInApp[id].removedAt, card:STATE.removedInApp[id].card }));
  return { hasSnapshot:true, snapshot:snap, inAppOnly, inCollectrOnly };
}
function removeCardsFromApp(ids){
  const rm = new Set(ids);
  const species = new Set(STATE.collection.filter(c => rm.has(c.id)).map(c => c.species).filter(Boolean));
  STATE.collection = STATE.collection.filter(c => !rm.has(c.id));
  Object.keys(STATE.picks).forEach(sp => { if(rm.has(STATE.picks[sp])) delete STATE.picks[sp]; });
  persist('collection'); persist('picks');
  autoAssignSinglePicks(species);
}
function restoreRemovedCards(ids){
  const species = new Set(); let n = 0;
  ids.forEach(id => {
    const t = STATE.removedInApp[id]; if(!t) return;
    if(!STATE.collection.some(c => c.id === id)){ STATE.collection.push(t.card); n++; if(t.card.species) species.add(t.card.species); }
    delete STATE.removedInApp[id];
  });
  persist('collection'); persist('removedInApp');
  autoAssignSinglePicks(species);
  return n;
}
/* How many things each tool is waiting on. Drives every red dot. */
function toolsStatus(){
  const d = collectrDiscrepancies();
  const picks = speciesNeedingPickReconciliation().length;
  const pairs = foilRegularGroups().length;
  const diffs = d.inAppOnly.length + d.inCollectrOnly.length;
  return { picks, pairs, diffs, total: picks + pairs + diffs };
}

/* "regular" | "foil" | "other" from Collectr's Variance text. */
function finishKind(variance){
  const v = norm(variance||'');
  if(!v || ['normal','regular','standard','none','unlimited'].includes(v) || /\bnon[- ]?(holo|foil)/.test(v)) return 'regular';
  if(v.includes('holo') || v.includes('foil')) return 'foil';
  return 'other';
}
/* Every card where you own BOTH a foil and a regular of the same card
   (same species + set + card number). Returns one entry per card. */
function foilRegularGroups(){
  const groups = new Map();
  STATE.collection.forEach(c => {
    const who = c.species || c.productName;
    if(!who || !c.set || !c.cardNumber) return;
    const key = [norm(who), norm(c.set), norm(c.cardNumber)].join('|');
    if(!groups.has(key)) groups.set(key, { species:c.species||null, name:who, set:c.set, cardNumber:c.cardNumber, regulars:[], foils:[] });
    const g = groups.get(key), kind = finishKind(c.variance);
    if(kind==='regular') g.regulars.push(c); else if(kind==='foil') g.foils.push(c);
  });
  return [...groups.values()].filter(g => g.regulars.length && g.foils.length);
}
function foilRegularCardIds(){
  const ids = new Set();
  foilRegularGroups().forEach(g => { g.regulars.forEach(c => ids.add(c.id)); g.foils.forEach(c => ids.add(c.id)); });
  return ids;
}
function dupBadgeHTML(c, dupMap, pairSet){
  if(pairSet && pairSet.has(c.id)){
    return `<span class="badge dupwarn" data-nav="duplicates" style="cursor:pointer;" title="You own both a foil and a regular of this card. Tap to see them all in one place.">⚠ Foil + regular</span>`;
  }
  const g = dupMap ? dupMap.get(c.id) : null;
  if(!g) return '';
  const t = `Same set &amp; card number as ${g.map(x=>esc(x.variance||'Regular')).join(', ')} — likely the same physical card logged twice.`;
  return `<span class="badge dupwarn" title="${t}">⚠ Possible duplicate finish</span>`;
}

function finishDuplicateGroups(){
  const groups = new Map();
  STATE.collection.forEach(c => {
    if(!c.species || !c.set || !c.cardNumber) return;
    const key = [norm(c.species), norm(c.set), norm(c.cardNumber)].join('|');
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(c);
  });
  const flagged = new Map();
  groups.forEach(cards => {
    if(cards.length < 2) return;
    const variances = new Set(cards.map(c => norm(c.variance||'regular')));
    if(variances.size < 2) return;
    cards.forEach(c => flagged.set(c.id, cards.filter(x=>x.id!==c.id)));
  });
  return flagged;
}

/* ============================================================
   Shared "find a Pokémon" search — powers the always-visible
   global search bar plus the inline searches on the Binder and
   Extras Binder pages. Every instance shares this same matching
   + result-row + wiring logic.
   ============================================================ */
function speciesSearchMatches(q, limit){
  limit = limit || 8;
  if(!q || !q.trim()) return [];
  const nq = norm(q);
  const nqDigits = q.trim().replace(/^#/,'');
  const isNumericQuery = /^\d+$/.test(nqDigits);
  const scored = [];
  for(const s of SPECIES){
    const n = norm(s.name);
    const dexStr = s.dex!=null ? String(s.dex) : '';
    let score = -1;
    if(n === nq) score = 0;
    else if(isNumericQuery && dexStr === nqDigits) score = 0;
    else if(n.startsWith(nq)) score = 1;
    else if(isNumericQuery && dexStr.length && dexStr.startsWith(nqDigits)) score = 1;
    else if(n.includes(nq)) score = 2;
    else if(norm(s.evoFamily||'').includes(nq)) score = 3;
    if(score >= 0) scored.push({ s, score });
  }
  scored.sort((a,b) => a.score - b.score || (a.s.dex??99999) - (b.s.dex??99999));
  return scored.slice(0, limit).map(x => x.s);
}
function speciesResultRow(s){
  const qty = speciesOwnedQty(s.name);
  const owned = isOwned(s.name);
  const slot = binderSlotBySpecies.get(s.name);
  const taxLabel = taxBreadcrumb(s);
  return `
    <div class="gs-row" data-nav-species="${esc(s.name)}">
      <div class="gs-thumb">${speciesImgTag(s,'gs-thumb-img')}</div>
      <div class="gs-info">
        <div class="gs-nm">${esc(s.name)}<span class="gs-dex">${s.dex ? '#'+String(s.dex).padStart(4,'0') : ''}</span></div>
        <div class="gs-tax">${esc(taxLabel)}</div>
      </div>
      <div class="gs-meta">
        ${owned ? `<span class="badge owned">Owned ×${qty}</span>` : `<span class="badge missing">Missing</span>`}
        ${slot ? `<span class="chip sm" data-goto-binder="${slot.page}">${ICONS.binder} Pg ${slot.page}</span>` : `<span class="chip sm" style="opacity:.5;">Not in binder</span>`}
      </div>
    </div>`;
}
function wireSpeciesSearchInput(inputEl, dropdownEl){
  if(!inputEl || !dropdownEl) return;
  const update = () => {
    const q = inputEl.value;
    if(!q || !q.trim()){ dropdownEl.innerHTML=''; dropdownEl.classList.remove('open'); return; }
    const matches = speciesSearchMatches(q, 8);
    dropdownEl.innerHTML = matches.length
      ? matches.map(speciesResultRow).join('')
      : `<div class="gs-empty">No species match “${esc(q)}”</div>`;
    dropdownEl.classList.add('open');
  };
  inputEl.addEventListener('input', debounce(update, 120));
  inputEl.addEventListener('focus', update);
}
function closeAllSearchDropdowns(){
  $$('.gs-dropdown.open').forEach(d => d.classList.remove('open'));
}

/* Reusable searchable species picker — a text input with a live-filtered
   dropdown, backed by a hidden input carrying the actual selected species
   name. Used anywhere the app needs the user to pick one of 1000+ species
   (import match review, manually reassigning a card's species, etc.) instead
   of scrolling a giant native <select>. */
function speciesPickerHTML({ id, hiddenClass, current, placeholder, extraAttrs }){
  const val = current || '';
  return `
    <div class="species-picker" data-for="${esc(id)}">
      <input type="text" class="species-picker-input" autocomplete="off" placeholder="${esc(placeholder||'Type to search species…')}" value="${esc(val)}">
      <input type="hidden" class="${esc(hiddenClass||'')}" id="${esc(id)}" value="${esc(val)}" ${extraAttrs||''}>
      <div class="gs-dropdown"></div>
    </div>`;
}
function speciesPickerRow(s){
  return `<div class="gs-row spp-row" data-name="${esc(s.name)}"><div class="gs-nm">${esc(s.name)}${s.dex?`<span class="gs-dex">#${String(s.dex).padStart(4,'0')}</span>`:''}</div></div>`;
}
function wireSpeciesPickers(root){
  (root||document).querySelectorAll('.species-picker').forEach(wrap=>{
    if(wrap.dataset.wired) return;
    wrap.dataset.wired = '1';
    const input = wrap.querySelector('.species-picker-input');
    const hidden = wrap.querySelector('input[type="hidden"]');
    const dropdown = wrap.querySelector('.gs-dropdown');
    const update = () => {
      const q = input.value;
      if(!q || !q.trim()){ dropdown.innerHTML=''; dropdown.classList.remove('open'); return; }
      const matches = speciesSearchMatches(q, 30);
      dropdown.innerHTML = matches.length ? matches.map(speciesPickerRow).join('') : `<div class="gs-empty">No species match "${esc(q)}"</div>`;
      dropdown.classList.add('open');
    };
    input.addEventListener('input', () => { hidden.value=''; update(); });
    input.addEventListener('focus', update);
    input.addEventListener('blur', () => {
      setTimeout(() => {
        // If they typed an exact species name but never clicked a suggestion,
        // still count it as a real pick rather than silently discarding it.
        if(!hidden.value){
          const typed = input.value.trim();
          const exact = typed && SPECIES.find(s=>s.name.toLowerCase()===typed.toLowerCase());
          if(exact){ hidden.value = exact.name; input.value = exact.name; }
        }
        dropdown.classList.remove('open');
      }, 150);
    });
    dropdown.addEventListener('mousedown', e => {
      const row = e.target.closest('.spp-row');
      if(!row) return;
      e.preventDefault();
      const name = row.dataset.name;
      input.value = name; hidden.value = name;
      dropdown.classList.remove('open'); dropdown.innerHTML = '';
      hidden.dispatchEvent(new Event('change'));
    });
  });
}

/* ============================================================
   Import engine — CSV/XLSX parsing, species matching, dedup
   ============================================================ */

const SUFFIX_RE = /\s*\([^()]*\)\s*$/;
const CARDMECH_RE = /\s+(VMAX|VSTAR|V-UNION|GX|EX|ex|V|BREAK|Prime|LV\.\s*X|Star|Legend|TAG TEAM|&\s*\w+\s*GX)\s*$/;
const PREFIX_RE = /^(Alolan|Galarian|Hisuian|Paldean|Mega|Dark|Light|Shining|Shadow Rider|Shadow|Ice Rider|Crowned|Rapid Strike|Single Strike|Crystal|Radiant|Team Rocket'?s|Rocket'?s)\s+/i;
const POSSESSIVE_RE = /^[A-Z][A-Za-z.]*'s\s+/;

function stripCardMechanics(name){
  let n = name;
  let changed = true;
  while(changed){
    changed = false;
    const stripped = n.replace(SUFFIX_RE,'').trim();
    if(stripped !== n){ n = stripped; changed = true; }
  }
  changed = true;
  while(changed){
    changed = false;
    const stripped = n.replace(CARDMECH_RE,'').trim();
    if(stripped !== n){ n = stripped; changed = true; }
  }
  return n;
}
function stripRegionalPrefix(name){
  return name.replace(PREFIX_RE,'').replace(POSSESSIVE_RE,'').trim();
}

/* Resolve a Collectr product name to a species name (or null if unresolved).
   Priority: user override table -> exact species name -> case-insensitive
   species name -> built-in alias table -> heuristic suffix/prefix stripping
   (exact + alias). The case-insensitive step matters most for regional-form
   names ("Hisuian Growlithe", "Galarian Meowth", etc.) — without it, any
   capitalization difference from Collectr falls through to prefix-stripping
   and silently matches the base species instead of the actual variant. */
const speciesNameByLower = new Map(SPECIES.map(s => [s.name.toLowerCase(), s.name]));
_nameIndexesReady = true;
function resolveSpecies(rawName){
  // A name you've learned by hand always wins; otherwise a Pokémon's old built-in name still lands on it.
  if(!STATE.overrides[norm(rawName)]){
    const t = String(rawName||'').trim().toLowerCase();
    for(const o in RENAMED_FROM){ if(o.toLowerCase() === t) return RENAMED_FROM[o]; }
  }
  const r = resolveSpeciesCore(rawName);
  if(!r) return null;
  // alias tables still point at built-in names: follow renames, and send a deleted Pokémon's names to where you moved its cards
  if(!speciesByName.has(r) && Object.prototype.hasOwnProperty.call(DELETED_REDIRECT, r)) return DELETED_REDIRECT[r];
  return RENAMED_FROM[r] || r;
}
function resolveSpeciesCore(rawName){
  const key = norm(rawName);
  if(STATE.overrides[key]) return STATE.overrides[key];
  if(speciesByName.has(rawName.trim())) return rawName.trim();
  const ciMatch = speciesNameByLower.get(rawName.trim().toLowerCase());
  if(ciMatch) return ciMatch;
  if(aliasLower[key]) return aliasLower[key];
  const stripped = stripRegionalPrefix(stripCardMechanics(rawName));
  if(speciesByName.has(stripped)) return stripped;
  const strippedKey = norm(stripped);
  if(aliasLower[strippedKey]) return aliasLower[strippedKey];
  return null;
}

/* Composite identity key for a Collectr row -> stable card id */
function compositeKey(row){
  const parts = [row.set, row.cardNumber, row.productName, row.variance, row.grade, row.condition]
    .map(v => norm(v));
  return stableId(parts.join('|'));
}

/* ---------------- CSV parsing (RFC4180-ish) ---------------- */
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], next = text[i+1];
    if(inQuotes){
      if(c === '"' && next === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\r'){ /* skip */ }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length>1 || (r.length===1 && r[0]!==''));
}

/* Map a header row + data row into a normalized Collectr row object.
   Handles the standard Collectr export column names, case-insensitively. */
function mapCollectrRow(headers, arr){
  const idx = {};
  headers.forEach((h,i) => idx[norm(h)] = i);
  const get = (...names) => {
    for(const n of names){ const i = idx[norm(n)]; if(i!=null && arr[i]!=null) return String(arr[i]).trim(); }
    return '';
  };
  // "Market Price" column ships as "Market Price (As of YYYY-MM-DD)" — the date varies per export,
  // so match any header that starts with "market price" rather than an exact name.
  const marketPriceHeader = Object.keys(idx).find(h => h.startsWith('market price'));
  const marketPriceRaw = marketPriceHeader != null ? String(arr[idx[marketPriceHeader]]||'').trim() : get('Market Price');
  return {
    portfolio: get('Portfolio Name','Portfolio'),
    category: get('Category'),
    set: get('Set'),
    productName: get('Product Name','Card Name'),
    cardNumber: get('Card Number','Card #'),
    rarity: get('Rarity'),
    variance: get('Variance','Variant'),
    grade: get('Grade'),
    condition: get('Card Condition','Condition'),
    costPaid: parseFloat(get('Average Cost Paid','Cost Paid'))||0,
    quantity: parseInt(get('Quantity'),10)||1,
    marketPrice: parseFloat(marketPriceRaw)||0,
    dateAdded: get('Date Added') || todayISO(),
    hasDateAdded: !!get('Date Added'),
    notes: get('Notes'),
  };
}

function parseCollectrFile(filename, arrOfArrays){
  const headers = arrOfArrays[0].map(h => String(h||''));
  const out = [];
  for(let i=1;i<arrOfArrays.length;i++){
    const r = arrOfArrays[i];
    if(!r || r.every(v => v==null || String(v).trim()==='')) continue;
    out.push(mapCollectrRow(headers, r));
  }
  return out;
}

/* Build an import preview from parsed rows, scoped to a chosen portfolio. */
/* Read the file's "Date Added" text into a local date. Handles 2026-10-09,
   2026-10-09 14:22:11, 10/9/2026, 10/9/26, 9/10/2026 (day first when the first
   number can't be a month), "Oct 9, 2026", and spreadsheet date serials. */
function parseDateAdded(v){
  if(v == null) return null;
  if(v instanceof Date) return isNaN(v) ? null : v;
  const s = String(v).trim();
  if(!s) return null;
  let m;
  if(/^\d{5}(\.\d+)?$/.test(s)){
    const n = parseFloat(s);
    if(n > 20000 && n < 80000){ const u = new Date(Math.round((n - 25569) * 86400000)); return new Date(u.getUTCFullYear(), u.getUTCMonth(), u.getUTCDate(), u.getUTCHours(), u.getUTCMinutes()); }
  }
  if((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T\s]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/))){
    const d = new Date(+m[1], +m[2]-1, +m[3], +(m[4]||0), +(m[5]||0), +(m[6]||0));
    return isNaN(d) ? null : d;
  }
  if((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})(?:[,\s]+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp][Mm])?)?/))){
    let a = +m[1], b = +m[2], y = +m[3];
    if(y < 100) y += 2000;
    let mo = a, d = b;
    if(a > 12 && b <= 12){ mo = b; d = a; }
    let H = +(m[4]||0); const ap = (m[7]||'').toLowerCase();
    if(ap === 'pm' && H < 12) H += 12; if(ap === 'am' && H === 12) H = 0;
    const dt = new Date(y, mo-1, d, H, +(m[5]||0), +(m[6]||0));
    return isNaN(dt) || mo < 1 || mo > 12 ? null : dt;
  }
  const t = Date.parse(s);
  return isNaN(t) ? null : new Date(t);
}
function startOfDay(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
const fmtDay = d => d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });

/* What counts as "new" in an import: a card in the file whose Date Added is on
   or after this day. choice: null/'auto' | 'today' | 'week' | 'none' | 'YYYY-MM-DD'. */
function resolveImportCutoff(choice){
  if(choice === 'none') return { date:null, label:'everything in the file counts as new' };
  if(choice === 'today'){ const d = startOfDay(new Date()); return { date:d, label:'added today' }; }
  if(choice === 'week'){ const d = startOfDay(new Date(Date.now() - 6*86400000)); return { date:d, label:'added in the last 7 days' }; }
  if(/^\d{4}-\d{2}-\d{2}$/.test(choice||'')){ const d = parseDateAdded(choice); if(d) return { date:startOfDay(d), label:'a date you picked' }; }
  const last = STATE.history.find(b => !b.cardsDeleted);
  if(last){ const d = startOfDay(new Date(last.date)); return { date:d, label:'the day of your last import', auto:true }; }
  let max = null;
  STATE.collection.forEach(c => { const d = parseDateAdded(c.dateAdded); if(d && (!max || d > max)) max = d; });
  if(max) return { date:startOfDay(max), label:'the newest card already in the app', auto:true };
  return { date:null, label:'there is no earlier import to compare with, so everything counts as new', auto:true };
}

/* Each row's status comes from what's IN the file:
     new        not in the app yet, and its Date Added is on/after the cutoff
     old        not in the app yet, but added before the cutoff (it goes in, without being called new)
     update     already in the app, but the quantity changed or the file's Date Added is later
     duplicate  already in the app and nothing real changed (a price move alone is not an update)
   A Pokémon you had none of counts all its cards as new, as long as one of them is. */
function buildImportPreview(rows, portfolioFilter, cutoffInfo){
  const wantPortfolio = norm(portfolioFilter);
  const cutoff = cutoffInfo === undefined ? resolveImportCutoff(null) : cutoffInfo;
  const portfoliosSeen = {};
  rows.forEach(r => { const p = r.portfolio || '(none)'; portfoliosSeen[p] = (portfoliosSeen[p]||0)+1; });

  const inScope = rows.filter(r => norm(r.portfolio) === wantPortfolio);
  const items = inScope.map(row => {
    const species = resolveSpecies(row.productName);
    const id = compositeKey(row);
    const existing = STATE.collection.find(c => c.id === id);
    const rowDate = row.hasDateAdded === false ? null : parseDateAdded(row.dateAdded);
    const recent = !cutoff || !cutoff.date || !rowDate || rowDate.getTime() >= cutoff.date.getTime();
    let status, refresh = false;
    if(STATE.removedInApp[id]) status = 'held'; // you removed this in the app; Collectr still has it
    else if(!species) status = 'review';
    else if(!existing) status = recent ? 'new' : 'old';
    else {
      const storedDate = parseDateAdded(existing.dateAdded);
      const qtyChanged = existing.quantity !== row.quantity;
      const laterDate = !!(rowDate && storedDate && rowDate.getTime() > storedDate.getTime());
      status = (qtyChanged || laterDate) ? 'update' : 'duplicate';
      refresh = status === 'duplicate' && (Math.abs((existing.marketPrice||0) - row.marketPrice) > 0.001 || Math.abs((existing.costPaid||0) - row.costPaid) > 0.001);
    }
    return { row, species, id, status, existing, refresh };
  });

  const owned = new Set(STATE.collection.filter(c => c.species).map(c => c.species));
  const hasNew = new Set(items.filter(i => i.status === 'new' && i.species).map(i => i.species));
  items.forEach(i => { if(i.status === 'old' && i.species && hasNew.has(i.species) && !owned.has(i.species)) i.status = 'new'; });

  return { items, portfoliosSeen, totalRows: rows.length, inScopeCount: inScope.length, cutoff };
}

function commitImport(preview, filename, chosenPortfolio){
  let added=0, updated=0, unchanged=0, reviewSkipped=0, learned=0, heldBack=0, older=0;
  const batchId = uid();
  const touchedSpecies = new Set();
  const newIds = [], updatedIds = [], oldIds = [];
  const ownedBefore = new Set(STATE.collection.filter(c => c.species).map(c => c.species));
  const idSpecies = new Map();
  for(const item of preview.items){
    if(item.status === 'held'){ heldBack++; continue; }
    const species = item.species || (item.manualSpecies || null);
    if(!species && !item.acceptUnlinked){
      reviewSkipped++;
      continue;
    }
    if(item.manualSpecies){
      STATE.overrides[norm(item.row.productName)] = item.manualSpecies;
      learned++;
    }
    const rec = {
      id: item.id,
      species: species,
      productName: item.row.productName,
      set: item.row.set,
      cardNumber: item.row.cardNumber,
      rarity: item.row.rarity,
      variance: item.row.variance,
      grade: item.row.grade,
      condition: item.row.condition,
      costPaid: item.row.costPaid,
      marketPrice: item.row.marketPrice,
      quantity: item.row.quantity,
      dateAdded: item.row.dateAdded,
      notes: item.row.notes,
      importBatch: batchId,
    };
    if(species){ touchedSpecies.add(species); idSpecies.set(rec.id, species); }
    if(item.status === 'old'){
      STATE.collection.push(rec);
      older++; oldIds.push(rec.id);
    } else if(item.status === 'new' || (item.status==='review' && !item.existing)){
      STATE.collection.push(rec);
      added++; newIds.push(rec.id);
    } else if(item.status === 'update' || (item.status==='review' && item.existing)){
      const i = STATE.collection.findIndex(c => c.id === item.id);
      if(i>=0){ if(STATE.collection[i].keepInApp) rec.keepInApp = true; STATE.collection[i] = rec; updated++; updatedIds.push(rec.id); } else { STATE.collection.push(rec); added++; newIds.push(rec.id); }
    } else {
      // unchanged; if only the price moved, quietly keep the stored price current
      if(item.refresh && item.existing){ item.existing.marketPrice = rec.marketPrice; item.existing.costPaid = rec.costPaid; }
      unchanged++;
    }
  }
  // A Pokémon you had no cards of before this import: every card of it in the
  // import counts as NEW, even if one of them matched an older unlinked record.
  const speciesWithNew = new Set(newIds.map(id => idSpecies.get(id)).filter(Boolean));
  const newSpecies = [...touchedSpecies].filter(sp => !ownedBefore.has(sp) && (speciesWithNew.has(sp) || updatedIds.some(id => idSpecies.get(id) === sp)));
  if(newSpecies.length){
    const ns = new Set(newSpecies);
    const moved = updatedIds.filter(id => ns.has(idSpecies.get(id)));
    if(moved.length){
      moved.forEach(id => { updatedIds.splice(updatedIds.indexOf(id),1); newIds.push(id); });
      updated -= moved.length; added += moved.length;
    }
  }
  // Remember exactly which cards Collectr had at this import, so the Tools
  // page can tell you where the app and Collectr disagree. Anything you'd
  // removed in the app that Collectr no longer lists is resolved: forget it.
  const snapIds = [...new Set(preview.items.map(i => i.id))];
  STATE.collectrSnapshot = { date: new Date().toISOString(), filename, portfolio: chosenPortfolio, ids: snapIds };
  const snapSet = new Set(snapIds);
  Object.keys(STATE.removedInApp).forEach(id => { if(!snapSet.has(id)) delete STATE.removedInApp[id]; });
  persist('collectrSnapshot'); persist('removedInApp');
  if(learned) persist('overrides');
  persist('collection');
  const batch = {
    id: batchId, date: new Date().toISOString(), filename,
    portfolio: chosenPortfolio,
    totalRows: preview.totalRows, inScope: preview.inScopeCount,
    added, updated, unchanged, reviewSkipped,
    newIds, updatedIds, oldIds, newSpecies, heldBack, older,
    cutoff: preview.cutoff && preview.cutoff.date ? preview.cutoff.date.toISOString() : null,
  };
  STATE.history.unshift(batch);
  persist('history');
  return { batch, touchedSpecies };
}

/* ============================================================
   Toast + Modal
   ============================================================ */
function toast(msg, ms=2600){
  let wrap = $('.toast-wrap');
  if(!wrap){ wrap = document.createElement('div'); wrap.className='toast-wrap'; document.body.appendChild(wrap); }
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .3s'; t.style.opacity='0'; setTimeout(()=>t.remove(),300); }, ms);
}

function openModal(title, bodyHTML, footHTML){
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modalOverlay';
  overlay.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head"><h3>${esc(title)}</h3><button class="iconbtn" data-action="close-modal" title="Close" aria-label="Close dialog">${ICONS.close}</button></div>
      <div class="modal-body">${bodyHTML}</div>
      ${footHTML ? `<div class="modal-foot">${footHTML}</div>` : ''}
    </div>`;
  overlay.addEventListener('click', e => { if(e.target === overlay) closeModal(); });
  document.body.appendChild(overlay);
  return overlay;
}
function closeModal(){ const o = $('#modalOverlay'); if(o) o.remove(); }

function confirmAction(message, onYes){
  openModal('Please confirm', `<p>${esc(message)}</p>`,
    `<button class="btn ghost" data-action="close-modal">Cancel</button>
     <button class="btn accent" id="confirmYes">Confirm</button>`);
  $('#confirmYes').addEventListener('click', () => { closeModal(); onYes(); });
}

const ROUTES = [
  { id:'dashboard', label:'Dashboard', icon:'dashboard' },
  { id:'collection', label:'Collection', icon:'collection' },
  { id:'pokedex', label:'Pokédex', icon:'pokedex' },
  { id:'taxonomy', label:'Taxonomy', icon:'taxonomy' },
  { id:'evolutions', label:'Evolutions', icon:'evolutions' },
  { id:'binder', label:'Binder', icon:'binder' },
  { id:'extras', label:'Extras Binder', icon:'extras' },
  { id:'tools', label:'Tools', icon:'tools' },
  { id:'import', label:'Import', icon:'import' },
  { id:'history', label:'Import History', icon:'history' },
  { id:'settings', label:'Settings', icon:'settings' },
];
// Tools is a hub: these pages all live under it in the menu.
const TOOL_ROUTE_IDS = ['tools','collectr','picks','duplicates'];
// The bottom tabbar only has room for a handful of tabs before they either
// get crammed or require horizontal scrolling to discover. These four cover
// the screens used day-to-day; everything else lives behind "More".
const MOBILE_PRIMARY_ROUTE_IDS = ['dashboard','collection','binder','pokedex'];

function currentRoute(){
  const hash = location.hash.replace(/^#\/?/, '');
  const [id, ...rest] = hash.split('/');
  return { id: id || 'dashboard', args: rest };
}

function navHTML(activeId, mobile){
  if(!mobile){
    return ROUTES.map(r => `<button class="navlink ${r.id===activeId?'active':''}" data-nav="${r.id}">${ICONS[r.icon]}<span>${r.label}</span>${r.id==='tools' && lastToolStatus.total ? redDotHTML() : ''}</button>`).join('');
  }
  const overflow = ROUTES.filter(r => !MOBILE_PRIMARY_ROUTE_IDS.includes(r.id));
  const primaryHTML = MOBILE_PRIMARY_ROUTE_IDS.map(id => ROUTES.find(r=>r.id===id))
    .map(r => `<button class="${r.id===activeId?'active':''}" data-nav="${r.id}">${ICONS[r.icon]}<span>${r.label.replace(' History','')}</span></button>`)
    .join('');
  const moreActive = overflow.some(r => r.id===activeId);
  return primaryHTML + `<button class="${moreActive?'active':''}" data-action="open-more-menu">${ICONS.more}<span>More</span>${lastToolStatus.total ? redDotHTML() : ''}</button>`;
}
function openMoreMenu(){
  lastToolStatus = toolsStatus();
  const { id: curId } = currentRoute();
  const activeId = TOOL_ROUTE_IDS.includes(curId) ? 'tools' : curId;
  const overflow = ROUTES.filter(r => !MOBILE_PRIMARY_ROUTE_IDS.includes(r.id));
  const body = `
    <div class="more-menu-list">
      ${overflow.map(r => `
        <button class="more-menu-item ${r.id===activeId?'active':''}" data-nav="${r.id}">
          ${ICONS[r.icon]}<span>${r.label}</span>${r.id==='tools' && lastToolStatus.total ? redDotHTML() : ''}
        </button>`).join('')}
    </div>`;
  openModal('More', body, '');
  $$('#modalOverlay [data-nav]').forEach(btn => btn.addEventListener('click', closeModal));
}

function renderShell(){
  const { id: curId } = currentRoute();
  const id = TOOL_ROUTE_IDS.includes(curId) ? 'tools' : curId;
  lastToolStatus = toolsStatus();
  $('#sidebarNav').innerHTML = navHTML(id, false);
  $('#tabbarNav').innerHTML = navHTML(id, true);
}

let LAST_ROUTE_KEY = null;
// Declared up here (before the first render() call) so refreshing the page on
// the reconcile or import-detail screens doesn't hit an uninitialised variable.
let reconcileQueue = [];
let reconcileReturnHash = '#/history';
let importDetailFilter = 'all';
let importDetailSort = 'recent';
let lastToolStatus = { picks:0, pairs:0, diffs:0, total:0 };
let binderHlAlts = new Map(); // species -> new non-pick cards (for the "replace?" icon); declared up here so a refresh on the Binder can't hit it uninitialised
let dupSort = 'alpha';
let importSelection = new Set();
function render(){
  const { id, args } = currentRoute();
  const routeKey = id + '|' + args.join('/');
  const isNewRoute = routeKey !== LAST_ROUTE_KEY;
  LAST_ROUTE_KEY = routeKey;

  // Preserve focus + cursor position across the innerHTML rebuild below, so
  // typing in a search box doesn't dismiss the on-screen keyboard on every
  // keystroke (the old behaviour: re-render destroyed and recreated the
  // input element each time, which blurs it).
  const active = document.activeElement;
  const activeId = active && active.id;
  const canRestore = !!(activeId && active.tagName && (active.tagName==='INPUT' || active.tagName==='TEXTAREA'));
  const selStart = canRestore && typeof active.selectionStart === 'number' ? active.selectionStart : null;
  const selEnd = canRestore && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;

  renderShell();
  const main = $('#main');
  const renderers = {
    dashboard: renderDashboard,
    collection: renderCollection,
    pokedex: args[0] ? renderSpeciesDetail : renderPokedex,
    taxonomy: renderTaxonomy,
    evolutions: renderEvolutions,
    binder: renderBinder,
    extras: renderExtras,
    duplicates: renderDuplicates,
    tools: renderTools,
    picks: renderPicksTool,
    collectr: renderCollectrDiff,
    import: renderImport,
    reconcile: renderReconcile,
    history: renderHistory,
    settings: renderSettings,
  };
  const fn = renderers[id] || renderDashboard;
  main.innerHTML = fn(args);
  if(isNewRoute) main.scrollTop = 0;
  wireScreenEvents(id, args);

  if(canRestore){
    const el = document.getElementById(activeId);
    if(el && (el.tagName==='INPUT' || el.tagName==='TEXTAREA')){
      el.focus({preventScroll:true});
      if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
}

  const navBtn = e.target.closest('[data-nav]');
  if(navBtn){ location.hash = '#/' + navBtn.dataset.nav; return; }

  const markOwnedBtn = e.target.closest('[data-action="toggle-manual-owned"]');
  if(markOwnedBtn){ toggleManualOwned(markOwnedBtn.dataset.species); return; }

  const delBtn = e.target.closest('[data-action="delete-card"]');
  if(delBtn){ deleteCard(delBtn.dataset.card); return; }
  const decideOpen = e.target.closest('[data-action="binder-decide"]');
  if(decideOpen){ openBinderDecideModal(decideOpen.dataset.species); return; }
  const decidePick = e.target.closest('[data-action="binder-decide-pick"]');
  if(decidePick){
    const sp = decidePick.dataset.species;
    binderDecidePick(sp, decidePick.dataset.card);
    closeModal(); toast(`${sp}: binder card changed. Swap it in your physical binder too.`); render(); return;
  }
  const decideKeep = e.target.closest('[data-action="binder-decide-keep"]');
  if(decideKeep){ binderDecideKeep(decideKeep.dataset.species); closeModal(); toast('Keeping the current card.'); render(); return; }
  const spNav = e.target.closest('[data-nav-species]');
  if(spNav){ closeAllSearchDropdowns(); location.hash = '#/pokedex/' + encodeURIComponent(spNav.dataset.navSpecies); return; }
  const taxNav = e.target.closest('[data-nav-taxonomy]');
  if(taxNav){ location.hash = '#/taxonomy/' + taxNav.dataset.navTaxonomy; return; }
  const binNav = e.target.closest('[data-nav-binder]');
  if(binNav){ location.hash = '#/binder/' + binNav.dataset.navBinder; return; }
  const addCardBtn = e.target.closest('[data-action="open-add-card"]');
  if(addCardBtn){ openAddCardModal(); return; }
  const moreMenuBtn = e.target.closest('[data-action="open-more-menu"]');
  if(moreMenuBtn){ openMoreMenu(); return; }
  const editBinderToggle = e.target.closest('[data-action="toggle-binder-edit"]');
  if(editBinderToggle){ toggleBinderEditMode(); return; }
  const editLabelBtn = e.target.closest('[data-action="edit-label"]');
  if(editLabelBtn){ openLabelEditor(editLabelBtn.dataset.slot); return; }
  const mergeSelectBtn = e.target.closest('[data-action="toggle-merge-select"]');
  if(mergeSelectBtn){ toggleMergeSelect(mergeSelectBtn.dataset.slot); return; }
  const combineBtn = e.target.closest('[data-action="combine-labels"]');
  if(combineBtn){ combineSelectedLabels(); return; }
  const unmergeEl = e.target.closest('[data-action="unmerge-label"]');
  if(unmergeEl){ openUnmergeModal(unmergeEl.dataset.slot); return; }
  const labelTapEl = e.target.closest('[data-action="edit-label-tap"]');
  if(labelTapEl){ openLabelEditor(labelTapEl.dataset.slot); return; }
  const pdxSelectModeBtn = e.target.closest('[data-action="toggle-pdx-select-mode"]');
  if(pdxSelectModeBtn){ pokedexSelectMode = !pokedexSelectMode; pokedexSelection = []; render(); return; }
  const pdxSelectCard = e.target.closest('[data-action="toggle-pdx-select"]');
  if(pdxSelectCard){
    const nm = pdxSelectCard.dataset.species;
    const idx = pokedexSelection.indexOf(nm);
    if(idx>=0) pokedexSelection.splice(idx,1); else pokedexSelection.push(nm);
    render(); return;
  }
  const bulkRecatBtn = e.target.closest('[data-action="open-bulk-recategorize"]');
  if(bulkRecatBtn){ openRecategorizeModal(pokedexSelection); return; }
  const bulkOwnBtn = e.target.closest('[data-action="bulk-mark-owned"]');
  if(bulkOwnBtn){
    pokedexSelection.forEach(nm => { STATE.manualOwned[nm] = true; });
    persist('manualOwned');
    toast(`${pokedexSelection.length} Pokémon marked as owned.`);
    pokedexSelectMode = false; pokedexSelection = [];
    render();
    return;
  }
  const delSpBtn = e.target.closest('[data-action="delete-species"]');
  if(delSpBtn){ openDeleteSpeciesModal(delSpBtn.dataset.species); return; }
  const resSpBtn = e.target.closest('[data-action="restore-species"]');
  if(resSpBtn){ if(restoreDeletedSpecies(resSpBtn.dataset.id)){ toast('Pokémon restored.'); render(); } return; }
  const renSpBtn = e.target.closest('[data-action="rename-species"]');
  if(renSpBtn){ openRenameSpeciesModal(renSpBtn.dataset.species); return; }
  const recatBtn = e.target.closest('[data-action="recategorize"]');
  if(recatBtn){ openRecategorizeModal([recatBtn.dataset.species]); return; }
  const undoBtn = e.target.closest('[data-action="undo-labels"]');
  if(undoBtn){ undoLabels(); return; }
  const redoBtn = e.target.closest('[data-action="redo-labels"]');
  if(redoBtn){ redoLabels(); return; }
  const addCatBtn = e.target.closest('[data-action="add-category"]');
  if(addCatBtn){ addCategoryToGroup(addCatBtn.dataset.group); return; }
  const renCatBtn = e.target.closest('[data-action="rename-category"]');
  if(renCatBtn){ renameCategory(renCatBtn.dataset.group, renCatBtn.dataset.category); return; }
  const delCatBtn = e.target.closest('[data-action="delete-category"]');
  if(delCatBtn){ deleteCategory(delCatBtn.dataset.group, delCatBtn.dataset.category); return; }
  const addSubBtn = e.target.closest('[data-action="add-subcategory"]');
  if(addSubBtn){ addSubcategory(addSubBtn.dataset.category); return; }
  const renSubBtn = e.target.closest('[data-action="rename-subcategory"]');
  if(renSubBtn){ renameSubcategory(renSubBtn.dataset.category, renSubBtn.dataset.subcategory); return; }
  const delSubBtn = e.target.closest('[data-action="delete-subcategory"]');
  if(delSubBtn){ deleteSubcategory(delSubBtn.dataset.category, delSubBtn.dataset.subcategory); return; }
  const editFamBtn = e.target.closest('[data-action="edit-family"]');
  if(editFamBtn){ openFamilyEditor(editFamBtn.dataset.fam); return; }
  const famRemoveBtn = e.target.closest('[data-action="fam-remove-member"]');
  if(famRemoveBtn){ removeFamilyMember(famRemoveBtn.dataset.species, famRemoveBtn.dataset.fam); return; }
  const addSpBtn = e.target.closest('[data-action="open-add-species"]');
  if(addSpBtn){ openAddSpeciesModal(); return; }
  const reconcilePickBtn = e.target.closest('[data-action="reconcile-pick"]');
  if(reconcilePickBtn){
    const species = reconcilePickBtn.dataset.species;
    const cardId = reconcilePickBtn.dataset.card;
    STATE.picks[species] = cardId;
    persist('picks');
    toast(`Binder pick set for ${species}.`);
    render();
    return;
  }
  const cutoffBtn = e.target.closest('[data-action="import-cutoff"]');
  if(cutoffBtn){ importState.cutoff = cutoffBtn.dataset.value === 'auto' ? null : cutoffBtn.dataset.value; render(); return; }
  const viewImportBtn = e.target.closest('[data-action="view-import"]');
  if(viewImportBtn){ importDetailFilter = 'all'; location.hash = '#/history/' + viewImportBtn.dataset.batch; return; }
  const viewImportListBtn = e.target.closest('[data-action="view-import-list"]');
  if(viewImportListBtn){ location.hash = '#/history'; return; }
  const delImportBtn = e.target.closest('[data-action="delete-import"]');
  if(delImportBtn){ deleteImportCards(delImportBtn.dataset.batch); return; }
  const importFilterBtn = e.target.closest('[data-action="import-filter"]');
  if(importFilterBtn){ importDetailFilter = importFilterBtn.dataset.value; render(); return; }
  const exGo = e.target.closest('[data-action="extras-goto"]');
  if(exGo){ extrasPage = parseInt(exGo.dataset.page,10) || 1; render(); return; }
  const hlWin = e.target.closest('[data-action="binder-hl-window"]');
  if(hlWin){
    const st = binderHlState(); st.window = hlWin.dataset.value;
    if(st.window === 'date' && !st.sinceDate){ const d = new Date(); d.setDate(d.getDate()-6); st.sinceDate = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
    persist('settings'); render(); return;
  }
  const hlToggle = e.target.closest('[data-action="binder-hl-toggle"]');
  if(hlToggle){ toggleBinderHighlight(hlToggle.dataset.batch); render(); return; }
  const hlDone = e.target.closest('[data-action="binder-hl-done"]');
  if(hlDone){
    confirmAction('Clear all the highlights? Anything you import from now on will be highlighted again.', () => { markBinderCaughtUp(); toast('Marked as placed.'); render(); });
    return;
  }
  const cdRemove = e.target.closest('[data-action="collectr-remove"]');
  if(cdRemove){
    const c = STATE.collection.find(x => x.id === cdRemove.dataset.card); if(!c) return;
    confirmAction(`Remove "${c.species||c.productName}" (${c.set} #${c.cardNumber}) from the app? It isn't in your latest Collectr export.`, () => { removeCardsFromApp([c.id]); toast('Card removed.'); render(); });
    return;
  }
  const cdRemoveAll = e.target.closest('[data-action="collectr-remove-all"]');
  if(cdRemoveAll){
    const ids = collectrDiscrepancies().inAppOnly.map(c => c.id); if(!ids.length) return;
    confirmAction(`Remove all ${ids.length} card${ids.length===1?'':'s'} that aren't in your latest Collectr export from the app? This can't be undone.`, () => { removeCardsFromApp(ids); toast(`${ids.length} card${ids.length===1?'':'s'} removed.`); render(); });
    return;
  }
  const cdKeep = e.target.closest('[data-action="collectr-keep"]');
  if(cdKeep){
    const c = STATE.collection.find(x => x.id === cdKeep.dataset.card);
    if(c){ c.keepInApp = true; persist('collection'); toast('Kept. It won\u2019t be flagged again.'); render(); }
    return;
  }
  const cdRestore = e.target.closest('[data-action="collectr-restore"]');
  if(cdRestore){ restoreRemovedCards([cdRestore.dataset.card]); toast('Added back.'); render(); return; }
  const heldBack = e.target.closest('[data-action="import-bring-back-held"]');
  if(heldBack && importState && importState.preview){
    const ids = importState.preview.items.filter(i => i.status === 'held').map(i => i.id);
    const n = restoreRemovedCards(ids);
    toast(`${fmtInt(n)} card${n===1?'':'s'} brought back into your collection.`);
    buildAndShowPreview();
    return;
  }
  const cdRestoreAll = e.target.closest('[data-action="collectr-restore-all"]');
  if(cdRestoreAll){ const n = restoreRemovedCards(collectrDiscrepancies().inCollectrOnly.map(e2 => e2.id)); toast(`${n} card${n===1?'':'s'} added back.`); render(); return; }
  const dupSortBtn = e.target.closest('[data-action="dup-sort"]');
  if(dupSortBtn){ dupSort = dupSortBtn.dataset.value; render(); return; }
  const dupRemoveBtn = e.target.closest('[data-action="dup-remove"]');
  if(dupRemoveBtn){ deleteCard(dupRemoveBtn.dataset.card); return; }
  const importSortBtn = e.target.closest('[data-action="import-sort"]');
  if(importSortBtn){ importDetailSort = importSortBtn.dataset.value; render(); return; }
  const impSelBox = e.target.closest('[data-action="toggle-import-select"]');
  if(impSelBox){
    const id = impSelBox.dataset.batch;
    if(importSelection.has(id)) importSelection.delete(id); else importSelection.add(id);
    render(); return;
  }
  const impSelAll = e.target.closest('[data-action="select-all-imports"]');
  if(impSelAll){ importSelection = new Set(STATE.history.map(b => b.id)); render(); return; }
  const impSelClear = e.target.closest('[data-action="clear-import-selection"]');
  if(impSelClear){ importSelection = new Set(); render(); return; }
  const viewSelBtn = e.target.closest('[data-action="view-selected-imports"]');
  if(viewSelBtn){
    const ids = STATE.history.map(b => b.id).filter(id => importSelection.has(id));
    if(!ids.length) return;
    importDetailFilter = 'all';
    location.hash = '#/history/' + ids.join(',');
    return;
  }
  const toggleDetailImp = e.target.closest('[data-action="toggle-detail-import"]');
  if(toggleDetailImp){
    const cur = parseBatchIds(currentRoute().args[0]);
    const id = toggleDetailImp.dataset.batch;
    const next = cur.includes(id) ? cur.filter(x => x !== id) : cur.concat(id);
    if(!next.length){ toast('Keep at least one import selected.'); return; }
    // keep them in history order (newest first) so the URL is stable
    const ordered = STATE.history.map(b => b.id).filter(x => next.includes(x));
    location.hash = '#/history/' + ordered.join(',');
    return;
  }
  const reconcileDoneBtn = e.target.closest('[data-action="reconcile-done"]');
  if(reconcileDoneBtn){
    reconcileQueue = [];
    location.hash = reconcileReturnHash || '#/history';
    return;
  }
});

/* ---------------- per-screen wiring (inputs/selects/drag-drop) ---------------- */
function wireScreenEvents(routeId){
  if(routeId === 'collection'){
    $('#colSearch')?.addEventListener('input', debounce(e => { collectionFilter.q = e.target.value; render(); }, 220));
    $('#colGroup')?.addEventListener('change', e => { collectionFilter.group = e.target.value; render(); });
    $('#colSort')?.addEventListener('change', e => { collectionFilter.sort = e.target.value; render(); });
    $('#colPickOnly')?.addEventListener('click', () => { collectionFilter.pickOnly = !collectionFilter.pickOnly; render(); });
  }
  else if(routeId === 'pokedex'){
    $('#pdxSearch')?.addEventListener('input', debounce(e => { pokedexFilter.q = e.target.value; render(); }, 220));
    $('#pdxGroup')?.addEventListener('change', e => { pokedexFilter.group = e.target.value; render(); });
    $('#pdxType')?.addEventListener('change', e => { pokedexFilter.type = e.target.value; render(); });
    $('#pdxStatus')?.addEventListener('change', e => { pokedexFilter.status = e.target.value; render(); });
    $('#pdxSort')?.addEventListener('change', e => { pokedexFilter.sort = e.target.value; render(); });
  }
  else if(routeId === 'evolutions'){
    $('#evoSearch')?.addEventListener('input', debounce(e => { evolutionsFilter.q = e.target.value; render(); }, 220));
  }
  else if(routeId === 'binder'){
    $('#binderPrev')?.addEventListener('click', () => { location.hash = '#/binder/' + (binderPage-1); });
    $('#binderNext')?.addEventListener('click', () => { location.hash = '#/binder/' + (binderPage+1); });
    $('#binderGo')?.addEventListener('click', () => { const v = parseInt($('#binderJump').value,10)||1; location.hash = '#/binder/' + v; });
    $('#binderHlDate')?.addEventListener('change', e => { binderHlState().sinceDate = e.target.value || null; persist('settings'); render(); });
    wireSpeciesSearchInput($('#binderSearch'), $('#binderSearchDropdown'));
  }
  else if(routeId === 'extras'){
    $('#binderHlDate')?.addEventListener('change', e => { binderHlState().sinceDate = e.target.value || null; persist('settings'); render(); });
    $('#extrasSearch')?.addEventListener('input', debounce(e => { extrasFilter.q = e.target.value; extrasPage = 1; render(); }, 220));
    $('#extrasPrev')?.addEventListener('click', () => { extrasPage = Math.max(1, extrasPage-1); render(); });
    $('#extrasNext')?.addEventListener('click', () => { extrasPage = extrasPage+1; render(); });
    $('#extrasGo')?.addEventListener('click', () => { extrasPage = parseInt($('#extrasJump').value,10)||1; render(); });
  }
  else if(routeId === 'import'){
    const dz = $('#dropzone');
    const fileInput = $('#fileInput');
    $('#chooseFileBtn')?.addEventListener('click', () => fileInput.click());
    fileInput?.addEventListener('change', e => { if(e.target.files[0]) handleImportFile(e.target.files[0]); });
    if(dz){
      dz.addEventListener('click', (e) => { if(e.target===dz || e.target.tagName==='H3' || e.target.tagName==='svg') fileInput.click(); });
      ['dragenter','dragover'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('drag'); }));
      ['dragleave','drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('drag'); }));
      dz.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if(f) handleImportFile(f); });
    }
    $('#portfolioSelect')?.addEventListener('change', e => { importState.portfolio = e.target.value; render(); });
    $('#cutoffDate')?.addEventListener('change', e => { importState.cutoff = e.target.value || null; render(); });
    $('#changeCutoffBtn')?.addEventListener('click', () => { importState.preview = null; render(); });
    $('#buildPreviewBtn')?.addEventListener('click', buildAndShowPreview);
    $('#cancelImport')?.addEventListener('click', () => { resetImportState(); render(); });
    $('#commitImportBtn')?.addEventListener('click', doCommitImport);
    wireSpeciesPickers();
  }
  else if(routeId === 'settings'){
    $('#exportBackupBtn')?.addEventListener('click', exportBackup);
    $('#checkStorageBtn')?.addEventListener('click', checkStorage);
    $('#exportCsvBtn')?.addEventListener('click', exportCollectionCSV);
    $('#exportTaxCsvBtn')?.addEventListener('click', exportCategorizationCSV);
    const restoreInput = $('#restoreInput');
    $('#restoreBackupBtn')?.addEventListener('click', () => restoreInput.click());
    restoreInput?.addEventListener('change', e => { if(e.target.files[0]) restoreBackup(e.target.files[0]); });
    $('#resetAllBtn')?.addEventListener('click', () => {
      confirmAction('Erase all cards, binder picks, and import history? This cannot be undone — export a backup first if you want to keep it.', () => {
        if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot=null; }
        GROUP_ORDER = JSON.parse(JSON.stringify(DEFAULT_GROUP_ORDER));
        CATEGORY_ORDER = JSON.parse(JSON.stringify(DEFAULT_CATEGORY_ORDER));
        SUBCATEGORY_ORDER = JSON.parse(JSON.stringify(DEFAULT_SUBCATEGORY_ORDER));
        STATE = { collection:[], picks:{}, history:[], overrides:{}, settings:{ cloudSync:{enabled:false,syncCode:'',config:null} }, labelOverrides:{}, mergedLabels:{}, categoryOverrides:{}, manualOwned:{}, taxonomy:{ version:TAXONOMY_SCHEMA_VERSION, groups:GROUP_ORDER, categories:CATEGORY_ORDER, subcategories:SUBCATEGORY_ORDER }, familyOverrides:{}, customSpecies:[], collectrSnapshot:null, removedInApp:{} };
        Object.keys(LS_KEYS).forEach(k => persist(k));
        rebuildBinder();
        toast('All data erased.');
        location.hash = '#/dashboard'; render();
      });
    });
    $('#csConnectBtn')?.addEventListener('click', async () => {
      const code = $('#csCode').value;
      const cfgText = $('#csConfig').value;
      const btn = $('#csConnectBtn');
      btn.disabled = true; btn.textContent = 'Connecting…';
      await connectCloudSync(cfgText, code);
      render();
    });
    $('#csHelpBtn')?.addEventListener('click', showCloudSyncHelp);
    $('#csPushBtn')?.addEventListener('click', async () => { await pushToCloud(); toast('Pushed this device\'s data to the cloud.'); });
    $('#csPullBtn')?.addEventListener('click', async () => { await pullThenWatch(); render(); });
    $('#csDisconnectBtn')?.addEventListener('click', () => {
      confirmAction('Turn off cloud sync? Your data stays right here on this device either way — nothing is deleted.', disconnectCloudSync);
    });
  }
}

/* ============================================================

function renderDashboard(){
  const s = collectionStats();
  const missingCount = s.totalSpecies - s.uniqueSpecies;
  const needPick = s.uniqueSpecies - s.binderPickCount;

  const topByValue = STATE.collection.slice().sort((a,b)=> (b.marketPrice*b.quantity) - (a.marketPrice*a.quantity)).slice(0,6);
  const setTotals = {};
  STATE.collection.forEach(c => { if(!c.set) return; setTotals[c.set] = (setTotals[c.set]||0) + c.marketPrice*c.quantity; });
  const topSets = Object.entries(setTotals).sort((a,b)=>b[1]-a[1]).slice(0,5);

  const empty = STATE.collection.length === 0;

  return `

      <div class="kpi"><div class="num">${fmtPct(s.collectionPct)}</div><div class="label">Collection completion</div></div>
      <div class="kpi"><div class="num">${fmtPct(s.binderPct)}</div><div class="label">Binder completion</div></div>
    </div>

    <div style="display:grid;grid-template-columns:1.3fr 1fr;gap:18px;" class="dashgrid">
      <div class="panel">
        <div class="section-title" style="margin-top:0;">Top cards by value</div>
        <div class="cardlist">
          ${topByValue.length ? topByValue.map(c => `
            <div class="cardrow">
              <div class="info">
                <div style="font-family:var(--font-display);font-weight:600;">${esc(c.species||c.productName)}</div>

        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:18px;">
        <div class="panel">
          <div class="section-title" style="margin-top:0;">Still needed</div>
          <div style="display:flex;justify-content:space-between;padding:6px 0;"><span>Missing from collection</span><b>${fmtInt(missingCount)}</b></div>
          <div style="display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line);"><span>Owned, no binder pick</span><b>${fmtInt(needPick)}</b></div>
          <div style="display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line);"><span>Sets represented</span><b>${fmtInt(s.setsCount)}</b></div>
        </div>
        <div class="panel">
          <div class="section-title" style="margin-top:0;">Top sets by value</div>

              <span>${esc(set)}</span><b>${fmtMoney(val)}</b>

        ${recentImports.map(b => `<tr><td>${esc(new Date(b.date).toLocaleDateString())}</td><td>${esc(b.filename)}</td><td>${b.added}</td><td>${b.updated}</td><td>${b.unchanged}</td><td>${b.reviewSkipped||0}</td></tr>`).join('')}

/* ============================================================
   Collection
   ============================================================ */
let collectionFilter = { q:'', group:'', pickOnly:false, sort:'name' };
let evolutionsFilter = { q:'' };

function renderCollection(){
  const groups = Array.from(new Set(SPECIES.map(s=>s.group))).sort();
  let rows = STATE.collection.slice();

  if(collectionFilter.q){
    const q = norm(collectionFilter.q);
    rows = rows.filter(c => norm(c.species||c.productName).includes(q) || norm(c.set).includes(q) || norm(c.productName).includes(q) || norm(c.cardNumber).includes(q));
  }
  if(collectionFilter.group){
    rows = rows.filter(c => c.species && speciesByName.get(c.species)?.group === collectionFilter.group);
  }
  if(collectionFilter.pickOnly){
    rows = rows.filter(c => c.species && STATE.picks[c.species] === c.id);
  }
  const sorters = {
    name: (a,b) => (a.species||a.productName).localeCompare(b.species||b.productName),
    value: (a,b) => (b.marketPrice*b.quantity) - (a.marketPrice*a.quantity),

        <option value="name" ${collectionFilter.sort==='name'?'selected':''}>Sort: Name</option>
        <option value="value" ${collectionFilter.sort==='value'?'selected':''}>Sort: Value</option>
        <option value="recent" ${collectionFilter.sort==='recent'?'selected':''}>Sort: Recently added</option>

    <div class="cardlist">
      ${(() => { const dupMap = finishDuplicateGroups(); const pairSet = foilRegularCardIds(); return rows.map(c => renderCardRow(c, dupMap, pairSet)).join(''); })()}

}

    c.marketPrice = parseFloat($('#edMkt').value)||0;
    c.notes = $('#edNotes').value;
    if(oldSpecies !== newSpecies && STATE.picks[oldSpecies] === c.id){ delete STATE.picks[oldSpecies]; persist('picks'); }
    // Teach the importer this raw product name maps to the chosen species, the
    // same way a manual match during import does. Without this, re-importing
    // the same Collectr CSV later (e.g. because market price changed) rebuilds
    // this exact card from scratch via resolveSpecies(productName) and silently
    // reverts a manual variant correction like "Meowth" -> "Galarian Meowth".
    if(newSpecies && c.productName){
      STATE.overrides[norm(c.productName)] = newSpecies;
      persist('overrides');
    }
    persist('collection');
    const touched = new Set([oldSpecies, newSpecies].filter(Boolean));
    autoAssignSinglePicks(touched);
    closeModal();
    toast('Card updated.');
    render();
  });
}

  const c = STATE.collection.find(x=>x.id===cardId);
  if(!c) return;
  confirmAction(`Remove "${c.species||c.productName}" (${c.set} #${c.cardNumber}) from your collection?${c.importBatch ? ' Collectr will still have it until you delete it there too. It stays listed under Tools until you do, and imports will skip it.' : ''}`, () => {
    recordAppRemovals([c]);
    STATE.collection = STATE.collection.filter(x=>x.id!==cardId);
    if(c.species && STATE.picks[c.species]===cardId) delete STATE.picks[c.species];
    persist('collection'); persist('picks');
    if(c.species) autoAssignSinglePicks(new Set([c.species]));

    render();
  });

/* ============================================================
   Pokédex
   ============================================================ */
let pokedexFilter = { q:'', group:'', status:'', sort:'dex', type:'' };
let pokedexSelectMode = false;
let pokedexSelection = [];

const ALL_TYPES = ['Normal','Fire','Water','Electric','Grass','Ice','Fighting','Poison','Ground','Flying','Psychic','Bug','Rock','Ghost','Dragon','Dark','Steel','Fairy'];
const TYPE_COLORS = {
  Normal:'#a8a878', Fire:'#f08030', Water:'#6890f0', Electric:'#f8d030', Grass:'#78c850', Ice:'#98d8d8',
  Fighting:'#c03028', Poison:'#a040a0', Ground:'#e0c068', Flying:'#a890f0', Psychic:'#f85888', Bug:'#a8b820',
  Rock:'#b8a038', Ghost:'#705898', Dragon:'#7038f8', Dark:'#705848', Steel:'#b8b8d0', Fairy:'#ee99ac'
};
function typeBadges(types){
  return (types||[]).map(t=>`<span class="type-badge" style="background:${TYPE_COLORS[t]||'#999'}">${esc(t)}</span>`).join('');
}
const TYPE_ABBR = {
  Normal:'NOR', Fire:'FIR', Water:'WAT', Electric:'ELE', Grass:'GRA', Ice:'ICE',
  Fighting:'FIG', Poison:'POI', Ground:'GRD', Flying:'FLY', Psychic:'PSY', Bug:'BUG',
  Rock:'ROC', Ghost:'GHO', Dragon:'DRA', Dark:'DAK', Steel:'STE', Fairy:'FAI'
};
// Compact colored symbol(s) for a species' type(s) — used on binder pockets where
// full typeBadges() text pills would be too wide.
function typeDots(types){
  return (types||[]).map(t=>`<span class="typedot" style="background:${TYPE_COLORS[t]||'#999'}" title="${esc(t)}">${TYPE_ABBR[t]||esc(t).slice(0,3).toUpperCase()}</span>`).join('');
}
// Name of the species this one evolves from (same evolution family, one stage
// earlier). When more than one prior-stage candidate exists (e.g. a species
// has both a base-form and a regional-form predecessor), prefer an exact
// variant-tag match; otherwise fall back to whichever candidate shares the
// most types, since the real lineage usually keeps at least one type in
// common (this correctly resolves cases like Overqwil, which isn't tagged
// as a variant itself but continues from the Hisuian Qwilfish line).
function evolvesFrom(s){
  if(!s || !s.evoFamily || !s.evoOrder || s.evoOrder<=1) return null;
  const prior = SPECIES.filter(x => x.evoFamily===s.evoFamily && x.evoOrder===s.evoOrder-1);
  if(!prior.length) return null;
  if(prior.length===1) return prior[0].name;
  // A parenthetical suffix on the name — e.g. "(Orange Flower)", "(Summer)",
  // "(Female)" — usually marks a cosmetic variant that should match the same
  // suffix on its prior stage (Florges (Orange Flower) <- Floette (Orange
  // Flower), not whichever color happens to come first in the list).
  const suffix = (s.name.match(/\(([^)]+)\)\s*$/)||[])[1];
  if(suffix){
    const sameSuffix = prior.find(x => x.name.includes(`(${suffix})`));
    if(sameSuffix) return sameSuffix.name;
  }
  if(s.variant){
    const sameVariant = prior.find(x => x.variant===s.variant);
    if(sameVariant) return sameVariant.name;
  }
  // Gender-branching families (evoFamily names both ♀ and ♂ starters, e.g.
  // "Nidoran♀/Nidoran♂") have no type or variant signal at all to tell the
  // two parallel lines apart — but each line's stages sit next to each other
  // in dex/array order, so the nearest candidate by array position is the
  // right one (fixes Nidorino/Nidoking otherwise defaulting to the ♀ line).
  if(s.evoFamily && s.evoFamily.includes('♀') && s.evoFamily.includes('♂')){
    const idx = SPECIES.indexOf(s);
    return prior.slice().sort((a,b)=>Math.abs(SPECIES.indexOf(a)-idx)-Math.abs(SPECIES.indexOf(b)-idx))[0].name;
  }
  const overlap = x => (x.types||[]).filter(t => (s.types||[]).includes(t)).length;
  return prior.slice().sort((a,b)=>overlap(b)-overlap(a))[0].name;
}
/* ---------------- Add a Pokémon that isn't in the dex yet ----------------
   Creates a brand-new species record (e.g. a regional form or custom entry
   you own that the built-in dex doesn't have). Saved to STATE.customSpecies
   so it survives reloads and reimports, and gets its own binder slot right
   away via rebuildBinder(). */
function openAddSpeciesModal(prefill){
  const FORM_LABELS = ['Alolan Form','Galarian Form','Hisuian Form','Paldean Form','Mega Evolution','Gigantamax Form','Named Form','Costume Form','Battle Form','Type Form','Gender Form','Form'];
  const PREFIX_FORMS = [['alolan ','Alolan Form'],['galarian ','Galarian Form'],['hisuian ','Hisuian Form'],['paldean ','Paldean Form'],['mega ','Mega Evolution'],['gigantamax ','Gigantamax Form']];
  const state = {
    name:'', dex:'', gen:'', group:'', category:'', subcategory:'', types:[],
    base:'', line:'own', stage:1, form:'', formTouched:false
  };
  if(prefill && typeof prefill === 'object') Object.assign(state, prefill);
  function baseSp(){ return state.base ? speciesByName.get(state.base) : null; }
  function sync(){
    const n = $('#newSpName'); if(!n) return;
    state.name = n.value; state.dex = $('#newSpDex').value; state.gen = $('#newSpGen').value;
    state.base = ($('#newSpBase').value||'').trim();
    const ln = $('#newSpLine'); if(ln) state.line = ln.value;
    const st = $('#newSpStage'); if(st) state.stage = parseInt(st.value,10)||1;
    const fm = $('#newSpForm'); if(fm) state.form = fm.value;
  }
  // Fill in everything we can from the Pokémon it is based on.
  function applyBase(){
    const b = baseSp(); if(!b) return;
    state.group = b.group; state.category = b.category; state.subcategory = b.subcategory;
    state.types = (b.types||[]).slice();
    state.dex = b.dex ? String(b.dex) : '';
    state.gen = b.generation || '';
    state.line = 'same';
    state.stage = b.evoOrder || 1;
  }
  function autoForm(){
    if(state.formTouched) return;
    const low = (state.name||'').trim().toLowerCase();
    const hit = PREFIX_FORMS.find(p => low.startsWith(p[0]));
    state.form = hit ? hit[1] : '';
  }
  function body(){
    const cats = CATEGORY_ORDER[state.group] || [];
    if(!cats.includes(state.category)) state.category = '';
    const subs = state.category ? (SUBCATEGORY_ORDER[state.category] || [state.category]) : [];
    if(!subs.includes(state.subcategory)) state.subcategory = '';
    const b = baseSp();
    const famName = b ? (b.evoFamily || b.name) : '';
    const forms = state.form && !FORM_LABELS.includes(state.form) ? [state.form].concat(FORM_LABELS) : FORM_LABELS;
    return `
      <div class="field"><label>Name</label><input type="text" id="newSpName" maxlength="60" placeholder="e.g. Galarian Perrserker" value="${esc(state.name)}"></div>
      <div class="field"><label>Copy details from an existing Pokémon (optional)</label>
        <input type="text" id="newSpBase" list="newSpBaseList" placeholder="e.g. Perrserker" autocomplete="off" value="${esc(state.base)}">
        <datalist id="newSpBaseList">${SPECIES.map(s=>`<option value="${esc(s.name)}"></option>`).join('')}</datalist>
        <div style="font-size:12px;color:var(--ink-soft);margin-top:4px;">Pick one and its category, types, Dex # and evolution line are filled in for you. You can still change anything below.</div>
      </div>
      ${b ? `
      <div class="row2">
        <div class="field"><label>Evolution line</label>
          <select id="newSpLine">
            <option value="same" ${state.line==='same'?'selected':''}>Same line as ${esc(b.name)} (${esc(famName)})</option>
            <option value="own" ${state.line!=='same'?'selected':''}>Its own separate line</option>
          </select>
        </div>
        <div class="field"><label>Stage in the line</label>
          <select id="newSpStage">${[1,2,3,4].map(n=>`<option value="${n}" ${state.stage===n?'selected':''}>Stage ${n}</option>`).join('')}</select>
        </div>
      </div>` : ''}
      <div class="field"><label>Is it a special form of another Pokémon?</label>
        <select id="newSpForm"><option value="">No — a regular Pokémon</option>${forms.map(f=>`<option value="${esc(f)}" ${state.form===f?'selected':''}>${esc(f)}</option>`).join('')}</select>
      </div>
      <div class="row2">
        <div class="field"><label>Dex # (leave blank if it has none)</label><input type="number" min="1" id="newSpDex" value="${esc(state.dex)}"></div>
        <div class="field"><label>Generation</label><input type="text" id="newSpGen" placeholder="e.g. Generation 9, or Custom" value="${esc(state.gen)}"></div>
      </div>
      <div class="field"><label>Types (pick up to 2)</label>
        <div style="display:flex;flex-wrap:wrap;gap:6px;">
          ${ALL_TYPES.map(t=>`<button type="button" class="chip newsp-type-chip ${state.types.includes(t)?'active':''}" data-type="${esc(t)}">${esc(t)}</button>`).join('')}
        </div>
      </div>
      <div class="field"><label>Group</label>
        <select id="newSpGroup"><option value="">— choose —</option>${GROUP_ORDER.map(g=>`<option value="${esc(g)}" ${state.group===g?'selected':''}>${esc(g)}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Category</label>
        <select id="newSpCategory" ${!state.group?'disabled':''}><option value="">— choose —</option>${cats.map(c=>`<option value="${esc(c)}" ${state.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Subcategory</label>
        <select id="newSpSubcategory" ${!state.category?'disabled':''}><option value="">— choose —</option>${subs.map(s=>`<option value="${esc(s)}" ${state.subcategory===s?'selected':''}>${esc(s)}</option>`).join('')}</select>
      </div>
      <p style="font-size:12px;color:var(--ink-soft);margin-top:6px;">It gets its own pocket in the binder, placed with its evolution line inside the category you choose.</p>
    `;
  }
  function paint(skipSync){
    if(!skipSync) sync();
    autoForm();
    $('#addSpBody').innerHTML = body();
    wire();
  }
  function wire(){
    $('#newSpGroup').addEventListener('change', e => { sync(); state.group = e.target.value; state.category=''; state.subcategory=''; paint(); });
    $('#newSpCategory').addEventListener('change', e => { sync(); state.category = e.target.value; state.subcategory=''; paint(); });
    $('#newSpSubcategory').addEventListener('change', e => { state.subcategory = e.target.value; });
    $('#newSpName').addEventListener('change', () => { sync(); const before = state.form; autoForm(); if(state.form !== before) paint(); });
    $('#newSpBase').addEventListener('change', () => {
      sync();
      const b = baseSp();
      if(state.base && !b){ toast('No Pokémon with that exact name — pick one from the list.'); return; }
      if(b){ applyBase(); state.formTouched = false; paint(true); return; }
      paint();
    });
    const fm = $('#newSpForm'); if(fm) fm.addEventListener('change', () => { sync(); state.formTouched = true; });
    $$('.newsp-type-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        sync();
        const t = chip.dataset.type;
        const idx = state.types.indexOf(t);
        if(idx>=0) state.types.splice(idx,1);
        else { if(state.types.length>=2){ toast('Choose at most 2 types.'); return; } state.types.push(t); }
        paint();
      });
    });
  }
  openModal('Add a Pokémon', `<div id="addSpBody">${body()}</div>`, `
    <button class="btn ghost" data-action="close-modal">Cancel</button>
    <button class="btn accent" id="addSpSaveBtn">Add</button>
  `);
  wire();
  $('#addSpSaveBtn').addEventListener('click', () => {
    sync();
    const name = (state.name||'').trim();
    if(!name){ toast('Give it a name.'); return; }
    if(speciesByName.has(name) || speciesNameByLower.has(name.toLowerCase()) || RENAMED_FROM.hasOwnProperty(name)){ toast('A Pokémon with that name already exists — search for it in the Pokédex.'); return; }
    if(state.base && !baseSp()){ toast('The "copy details from" Pokémon isn\'t in the list — pick one from the list or clear that box.'); return; }
    if(!state.group || !state.category || !state.subcategory){ toast('Choose a group, category, and subcategory.'); return; }
    const dex = state.dex ? (parseInt(state.dex,10)||null) : null;
    const generation = (state.gen||'').trim() || 'Custom';
    const b = baseSp();
    const sameLine = !!(b && state.line === 'same');
    const sp = {
      id: 'custom-'+Date.now(),
      dex, name, group: state.group, category: state.category, subcategory: state.subcategory,
      generation, evoFamily: sameLine ? (b.evoFamily || b.name) : name,
      evoOrder: sameLine ? (state.stage || 1) : 1,
      types: state.types.length ? state.types.slice() : ['Normal'],
    };
    if(state.form){
      sp.variant = state.form;
      let baseName = b ? (b.baseSpecies || b.name) : null;
      if(!b){
        const low = name.toLowerCase();
        const hit = PREFIX_FORMS.find(p => low.startsWith(p[0]));
        if(hit){ const stripped = name.slice(hit[0].length); if(speciesByName.has(stripped)) baseName = stripped; }
      }
      if(baseName && baseName !== name) sp.baseSpecies = baseName;
    }
    SPECIES.push(sp);
    STATE.customSpecies.push(sp);
    applySpeciesDeletions();   // refreshes every name lookup so imports can match the new name too
    persist('customSpecies');
    STATE.categoryOverrides[sp.name] = { group: sp.group, category: sp.category, subcategory: sp.subcategory };
    persist('categoryOverrides');
    rebuildBinder();
    closeModal();
    const slot = binderSlotBySpecies.get(name);
    toast(slot ? `${name} added — page ${slot.page}, pocket ${slot.pocket}.` : `${name} added — it has a spot in the binder now.`);
    if(slot){ location.hash = '#/binder/' + slot.page; }
    render();
  });
}
