/* ============================================================
   Taxonomy browser (drill-down: group -> category -> subcategory -> species)
   ============================================================ */
function taxLevelKey(level){ return ['group','category','subcategory'][level]; }

function renderTaxonomy(args){
  const path = args.map(a=>decodeURIComponent(a)).filter(a=>a && a!=='—');
  const level = path.length; // 0=groups,1=categories,2=subcategories,3=species list

  const crumbs = `<div class="crumbs"><span class="c" data-nav="taxonomy">Taxonomy</span>` +
    path.map((p,i)=>` <span>›</span> <span class="c" data-nav-taxonomy="${path.slice(0,i+1).map(encodeURIComponent).join('/')}">${esc(p)}</span>`).join('') + `</div>`;

  if(level >= 3 || (level>0 && !hasDeeperLevel(path))){
    // species list at this taxonomy node
    const filtered = SPECIES.filter(s => matchesPath(s, path));
    const owned = filtered.filter(s=>isOwned(s.name)).length;
    return `
      ${crumbs}
      <div class="pagehead"><h1>${esc(path[path.length-1] || 'All species')}</h1></div>
      <div class="panel" style="margin-bottom:18px;display:flex;gap:24px;flex-wrap:wrap;">
        <div><div class="num" style="font-family:var(--font-display);font-size:20px;">${owned} / ${filtered.length}</div><div class="label" style="font-size:11px;color:var(--ink-soft);">species owned</div></div>
        <div><div class="num" style="font-family:var(--font-display);font-size:20px;">${fmtPct(filtered.length?owned/filtered.length*100:0)}</div><div class="label" style="font-size:11px;color:var(--ink-soft);">completion</div></div>
      </div>
      <div class="grid-species">${filtered.sort((a,b)=>(a.dex??99999)-(b.dex??99999)).map(renderSpeciesCard).join('')}</div>
    `;
  }

  // group/category/subcategory listing
  const key = taxLevelKey(level);
  const children = Array.from(new Set(SPECIES.filter(s=>matchesPath(s,path)).map(s=>s[key]))).filter(v=>v).sort();
  return `
    ${crumbs}
    <div class="pagehead"><h1>${level===0?'Taxonomy':esc(path[path.length-1])}</h1><div class="sub">${level===0?'Browse the collection by taxonomy':'Drill down'}</div></div>
    <div class="taxlist">
      ${children.map(childVal => {
        const childPath = [...path, childVal];
        const inGroup = SPECIES.filter(s=>matchesPath(s,childPath));
        const owned = inGroup.filter(s=>isOwned(s.name)).length;
        const pct = inGroup.length ? owned/inGroup.length*100 : 0;
        return `
        <div class="taxrow" data-nav-taxonomy="${childPath.map(encodeURIComponent).join('/')}">
          <div class="nm">${esc(childVal)}</div>
          <div class="stats">
            <span>${owned} / ${inGroup.length}</span>
            <span class="barbg"><span class="barfg" style="width:${pct}%;"></span></span>
          </div>
        </div>`;
      }).join('')}
    </div>
  `;
}
function matchesPath(s, path){
  const keys = ['group','category','subcategory'];
  return path.every((p,i) => s[keys[i]] === p);
}
function hasDeeperLevel(path){
  const key = taxLevelKey(path.length);
  if(!key) return false;
  return SPECIES.some(s => matchesPath(s,path) && s[key] && s[key] !== '—');
}

/* ============================================================
   Binder
   ============================================================ */
let binderPage = 1;
let binderEditMode = false;
let mergeSelection = [];
let labelUndoStack = [];
let labelRedoStack = [];

function snapshotLabels(){ return JSON.stringify({ o: STATE.labelOverrides, m: STATE.mergedLabels }); }
function pushLabelUndo(){
  labelUndoStack.push(snapshotLabels());
  if(labelUndoStack.length > 50) labelUndoStack.shift();
  labelRedoStack = [];
}
function undoLabels(){
  if(!labelUndoStack.length){ toast('Nothing to undo.'); return; }
  labelRedoStack.push(snapshotLabels());
  const prev = JSON.parse(labelUndoStack.pop());
  STATE.labelOverrides = prev.o; STATE.mergedLabels = prev.m;
  persist('labelOverrides'); persist('mergedLabels');
  toast('Undone.'); render();
}
function redoLabels(){
  if(!labelRedoStack.length){ toast('Nothing to redo.'); return; }
  labelUndoStack.push(snapshotLabels());
  const next = JSON.parse(labelRedoStack.pop());
  STATE.labelOverrides = next.o; STATE.mergedLabels = next.m;
  persist('labelOverrides'); persist('mergedLabels');
  toast('Redone.'); render();
}
function toggleBinderEditMode(){
  binderEditMode = !binderEditMode;
  mergeSelection = [];
  render();
}
function toggleMergeSelect(slotStr){
  const idx = mergeSelection.indexOf(slotStr);
  if(idx>=0) mergeSelection.splice(idx,1); else mergeSelection.push(slotStr);
  render();
}
function openLabelEditor(slotStr){
  const key = slotStr;
  const item = BINDER.find(b=>b.key===key);
  if(!item) return;
  const isCategoryLevel = item.labelLevel === 'CATEGORY' || item.labelLevel === 'SUBCATEGORY';
  const current = STATE.labelOverrides[key] || item.display;
  openModal('Edit label', `
    <div class="field">
      <label>Label text</label>
      <input type="text" id="labelEditInput" value="${esc(current)}" maxlength="60">
    </div>
    <p style="font-size:12px;color:var(--ink-soft);margin-top:8px;">Page ${item.page}, pocket ${item.pocket} · ${esc(item.labelLevel||'')}${isCategoryLevel ? ' — this renames it everywhere, including in Settings' : ''}</p>
  `, `
    <button class="btn ghost" data-action="close-modal">Cancel</button>
    ${(!isCategoryLevel && STATE.labelOverrides[key]) ? `<button class="btn ghost" id="labelResetBtn">Reset to original</button>` : ''}
    <button class="btn accent" id="labelSaveBtn">Save</button>
  `);
  $('#labelSaveBtn').addEventListener('click', () => {
    const val = ($('#labelEditInput').value||'').trim();
    if(!val){ toast("Label can't be empty."); return; }
    // CATEGORY/SUBCATEGORY pockets are renamed for real (same code path as the
    // Settings taxonomy manager) instead of getting a cosmetic-only overlay —
    // otherwise the binder and Settings can end up showing two different names
    // for what's supposed to be the same category.
    if(item.labelLevel === 'CATEGORY'){
      if(val === item.category){ closeModal(); return; }
      if(doRenameCategory(item.group, item.category, val)){ closeModal(); toast('Category renamed.'); render(); }
      return;
    }
    if(item.labelLevel === 'SUBCATEGORY'){
      if(val === item.subcategory){ closeModal(); return; }
      if(doRenameSubcategory(item.category, item.subcategory, val)){ closeModal(); toast('Subcategory renamed.'); render(); }
      return;
    }
    pushLabelUndo();
    if(val === item.display) delete STATE.labelOverrides[key];
    else STATE.labelOverrides[key] = val;
    persist('labelOverrides');
    closeModal(); toast('Label updated.'); render();
  });
  $('#labelResetBtn')?.addEventListener('click', () => {
    pushLabelUndo();
    delete STATE.labelOverrides[key];
    persist('labelOverrides');
    closeModal(); toast('Reset to original text.'); render();
  });
}
function openUnmergeModal(slotStr){
  const key = slotStr;
  const item = BINDER.find(b=>b.key===key);
  const targetKey = STATE.mergedLabels[key];
  const target = BINDER.find(b=>b.key===targetKey);
  if(!item || !target) return;
  openModal('Merged label', `<p>"${esc(item.display)}" is currently combined into the label on page ${target.page}, pocket ${target.pocket} ("${esc(STATE.labelOverrides[targetKey] || target.display)}"). Restore it as its own label?</p>`,
    `<button class="btn ghost" data-action="close-modal">Cancel</button>
     <button class="btn accent" id="unmergeBtn">Restore</button>`);
  $('#unmergeBtn').addEventListener('click', () => {
    pushLabelUndo();
    delete STATE.mergedLabels[key];
    persist('mergedLabels');
    closeModal(); toast('Restored as its own label.'); render();
  });
}
function combineSelectedLabels(){
  if(mergeSelection.length < 2){ toast('Select at least two labels to combine.'); return; }
  const items = mergeSelection.map(k=>BINDER.find(b=>b.key===k)).filter(Boolean);
  const level = items[0].labelLevel;
  if(items.some(it=>it.labelLevel!==level)){ toast('You can only combine labels of the same level — e.g. two categories, or two subcategories.'); return; }
  items.sort((a,b)=>a.slot-b.slot);
  const target = items[0];
  const rest = items.slice(1);
  pushLabelUndo();
  const texts = items.map(it => STATE.labelOverrides[it.key] || it.display);
  STATE.labelOverrides[target.key] = texts.join(' & ');
  rest.forEach(it => { STATE.mergedLabels[it.key] = target.key; delete STATE.labelOverrides[it.key]; });
  persist('labelOverrides'); persist('mergedLabels');
  mergeSelection = [];
  toast('Combined — tap the label to rename it.');
  render();
}

/* ============================================================
   Taxonomy management — add, rename, or remove the categories and
   subcategories used to sort the binder. Saved to STATE.taxonomy so
   it survives reloads and travels with backup export/restore.
   ============================================================ */
function saveTaxonomy(){
  STATE.taxonomy = { version: TAXONOMY_SCHEMA_VERSION, groups: GROUP_ORDER, categories: CATEGORY_ORDER, subcategories: SUBCATEGORY_ORDER };
  persist('taxonomy');
}
function promptTextModal(title, label, initialValue, onSave){
  openModal(title, `
    <div class="field">
      <label>${esc(label)}</label>
      <input type="text" id="taxPromptInput" value="${esc(initialValue||'')}" maxlength="60">
    </div>
  `, `
    <button class="btn ghost" data-action="close-modal">Cancel</button>
    <button class="btn accent" id="taxPromptSaveBtn">Save</button>
  `);
  const input = $('#taxPromptInput');
  input.focus(); input.select();
  const submit = () => {
    const val = (input.value||'').trim();
    if(!val){ toast("Name can't be empty."); return; }
    onSave(val);
  };
  $('#taxPromptSaveBtn').addEventListener('click', submit);
  input.addEventListener('keydown', e => { if(e.key==='Enter') submit(); });
}
function addCategoryToGroup(group){
  promptTextModal('Add category', `New category under "${group}"`, '', name => {
    if((CATEGORY_ORDER[group]||[]).some(c=>c.toLowerCase()===name.toLowerCase())){ toast('That category already exists in this group.'); return; }
    if(!CATEGORY_ORDER[group]) CATEGORY_ORDER[group] = [];
    CATEGORY_ORDER[group].push(name);
    // every category needs at least one subcategory so the recategorize
    // menu always has something to select — using the category's own name
    // means "no real subdivision" without a blank/broken dropdown.
    if(!SUBCATEGORY_ORDER[name] || !SUBCATEGORY_ORDER[name].length) SUBCATEGORY_ORDER[name] = [name];
    saveTaxonomy();
    closeModal(); toast(`"${name}" added.`); render();
  });
}
/* Core rename logic, usable both from the Settings taxonomy manager (via
   renameCategory below) and directly from the binder's "Edit label" flow on a
   CATEGORY pocket, so both places share one source of truth and can never
   drift apart (a category's real name always matches what the binder shows). */
function doRenameCategory(group, oldName, newName){
  if(newName === oldName) return true;
  if((CATEGORY_ORDER[group]||[]).some(c=>c.toLowerCase()===newName.toLowerCase())){ toast('That name is already used in this group.'); return false; }
  CATEGORY_ORDER[group] = (CATEGORY_ORDER[group]||[]).map(c => c===oldName ? newName : c);
  if(SUBCATEGORY_ORDER[oldName]){ SUBCATEGORY_ORDER[newName] = SUBCATEGORY_ORDER[oldName]; delete SUBCATEGORY_ORDER[oldName]; }
  let touched = false;
  SPECIES.forEach(s => {
    if(s.category === oldName){
      s.category = newName; touched = true;
      STATE.categoryOverrides[s.name] = { group: s.group, category: s.category, subcategory: s.subcategory };
    }
  });
  if(touched) persist('categoryOverrides');
  const oldKey = 'CATEGORY::'+oldName, newKey = 'CATEGORY::'+newName;
  if(STATE.labelOverrides[oldKey] !== undefined){ STATE.labelOverrides[newKey] = STATE.labelOverrides[oldKey]; delete STATE.labelOverrides[oldKey]; persist('labelOverrides'); }
  saveTaxonomy();
  rebuildBinder();
  return true;
}
function renameCategory(group, oldName){
  promptTextModal('Rename category', 'Category name', oldName, newName => {
    if(newName === oldName){ closeModal(); return; }
    if(doRenameCategory(group, oldName, newName)){ closeModal(); toast('Category renamed.'); render(); }
  });
}
function deleteCategory(group, name){
  const inUse = SPECIES.some(s => s.category === name);
  if(inUse){ toast('Recategorize the Pokémon using this category before deleting it.'); return; }
  confirmAction(`Delete the category "${name}" and its subcategories? This can't be undone.`, () => {
    CATEGORY_ORDER[group] = (CATEGORY_ORDER[group]||[]).filter(c=>c!==name);
    delete SUBCATEGORY_ORDER[name];
    saveTaxonomy();
    rebuildBinder();
    toast('Category deleted.'); render();
  });
}
function addSubcategory(category){
  promptTextModal('Add subcategory', `New subcategory under "${category}"`, '', name => {
    if(!SUBCATEGORY_ORDER[category]) SUBCATEGORY_ORDER[category] = [];
    if(SUBCATEGORY_ORDER[category].some(s=>s.toLowerCase()===name.toLowerCase())){ toast('That subcategory already exists.'); return; }
    SUBCATEGORY_ORDER[category].push(name);
    SUBCATEGORY_ORDER[category].sort((a,b)=>a.localeCompare(b));
    saveTaxonomy();
    closeModal(); toast(`"${name}" added.`); render();
  });
}
function doRenameSubcategory(category, oldName, newName){
  if(newName === oldName) return true;
  if((SUBCATEGORY_ORDER[category]||[]).some(s=>s.toLowerCase()===newName.toLowerCase())){ toast('That name is already used in this category.'); return false; }
  SUBCATEGORY_ORDER[category] = (SUBCATEGORY_ORDER[category]||[]).map(s => s===oldName ? newName : s);
  let touched = false;
  SPECIES.forEach(s => {
    if(s.category===category && s.subcategory === oldName){
      s.subcategory = newName; touched = true;
      STATE.categoryOverrides[s.name] = { group: s.group, category: s.category, subcategory: s.subcategory };
    }
  });
  if(touched) persist('categoryOverrides');
  const oldKey = 'SUBCATEGORY::'+oldName, newKey = 'SUBCATEGORY::'+newName;
  if(STATE.labelOverrides[oldKey] !== undefined){ STATE.labelOverrides[newKey] = STATE.labelOverrides[oldKey]; delete STATE.labelOverrides[oldKey]; persist('labelOverrides'); }
  saveTaxonomy();
  rebuildBinder();
  return true;
}
function renameSubcategory(category, oldName){
  promptTextModal('Rename subcategory', 'Subcategory name', oldName, newName => {
    if(newName === oldName){ closeModal(); return; }
    if(doRenameSubcategory(category, oldName, newName)){ closeModal(); toast('Subcategory renamed.'); render(); }
  });
}
function deleteSubcategory(category, name){
  const inUse = SPECIES.some(s => s.category===category && s.subcategory === name);
  if(inUse){ toast('Recategorize the Pokémon using this subcategory before deleting it.'); return; }
  confirmAction(`Delete the subcategory "${name}"? This can't be undone.`, () => {
    SUBCATEGORY_ORDER[category] = (SUBCATEGORY_ORDER[category]||[]).filter(s=>s!==name);
    saveTaxonomy();
    rebuildBinder();
    toast('Subcategory deleted.'); render();
  });
}

/* ============================================================
   Recategorize — change a species' (or several species') taxonomy
   placement by hand; the physical binder reflows automatically.
   ============================================================ */
function openRecategorizeModal(names){
  const specs = (names||[]).map(n=>speciesByName.get(n)).filter(Boolean);
  if(!specs.length) return;
  const common = field => { const vals = new Set(specs.map(s=>s[field])); return vals.size===1 ? [...vals][0] : ''; };
  const state = { group: common('group'), category: common('category'), subcategory: common('subcategory') };

  function body(){
    const cats = CATEGORY_ORDER[state.group] || [];
    if(!cats.includes(state.category)) state.category = '';
    const subs = state.category ? (SUBCATEGORY_ORDER[state.category] || [state.category]) : [];
    if(!subs.includes(state.subcategory)) state.subcategory = '';
    return `
      <div class="field"><label>Group</label>
        <select id="rcGroup">
          <option value="">— choose —</option>
          ${GROUP_ORDER.map(x=>`<option value="${esc(x)}" ${state.group===x?'selected':''}>${esc(x)}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Category</label>
        <select id="rcCategory" ${!state.group?'disabled':''}>
          <option value="">— choose —</option>
          ${cats.map(x=>`<option value="${esc(x)}" ${state.category===x?'selected':''}>${esc(x)}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Subcategory</label>
        <select id="rcSubcategory" ${!state.category?'disabled':''}>
          <option value="">— choose —</option>
          ${subs.map(x=>`<option value="${esc(x)}" ${state.subcategory===x?'selected':''}>${esc(x)}</option>`).join('')}
        </select>
      </div>
      <p style="font-size:12px;color:var(--ink-soft);margin-top:8px;">${specs.length===1 ? esc(specs[0].name) : specs.length+' Pokémon selected — this moves all of them together.'}</p>
    `;
  }
  function paint(){ $('#rcBody').innerHTML = body(); wire(); }
  function wire(){
    $('#rcGroup')?.addEventListener('change', e => { state.group = e.target.value; state.category=''; state.subcategory=''; paint(); });
    $('#rcCategory')?.addEventListener('change', e => { state.category = e.target.value; state.subcategory=''; paint(); });
    $('#rcSubcategory')?.addEventListener('change', e => { state.subcategory = e.target.value; });
  }

  openModal('Recategorize', `<div id="rcBody">${body()}</div>`,
    `<button class="btn ghost" data-action="close-modal">Cancel</button>
     <button class="btn accent" id="rcSaveBtn">Save & reflow binder</button>`);
  wire();
  function commit(extraSpecs){
    const ov = { group: state.group, category: state.category, subcategory: state.subcategory };
    const all = extraSpecs ? specs.concat(extraSpecs) : specs;
    all.forEach(sp => { Object.assign(sp, ov); STATE.categoryOverrides[sp.name] = ov; });
    persist('categoryOverrides');
    rebuildBinder();
    closeModal();
    toast(all.length===1 ? `${all[0].name} recategorized.` : `${all.length} Pokémon recategorized.`);
    pokedexSelectMode = false; pokedexSelection = [];
    render();
  }
  $('#rcSaveBtn').addEventListener('click', () => {
    if(!state.group || !state.category || !state.subcategory){ toast('Choose a group, category, and subcategory.'); return; }
    // If any selected Pokémon belongs to an evolution family, offer to move
    // the rest of that family along with it, so you don't have to repeat
    // this for every stage by hand.
    const selectedNames = new Set(specs.map(s=>s.name));
    const familyNames = new Set(specs.map(s=>s.evoFamily).filter(Boolean));
    const restOfFamily = SPECIES.filter(s => familyNames.has(s.evoFamily) && !selectedNames.has(s.name));
    if(restOfFamily.length){
      const listText = restOfFamily.map(s=>s.name).join(', ');
      openModal('Update the whole family too?', `
        <p>${specs.length===1 ? esc(specs[0].name) : 'These Pokémon'} ${specs.length===1?'is':'are'} part of an evolution family. Move the rest of the family (${esc(listText)}) to the same category too?</p>
      `, `
        <button class="btn ghost" id="rcFamilyNoBtn">Just this one</button>
        <button class="btn accent" id="rcFamilyYesBtn">Move the whole family</button>
      `);
      $('#rcFamilyYesBtn').addEventListener('click', () => commit(restOfFamily));
      $('#rcFamilyNoBtn').addEventListener('click', () => commit());
      return;
    }
    commit();
  });
}

/* ---------------- Edit evolution family membership ----------------
   Lets you fix a mismatched family (two forms that should be one line
   but aren't linking up), add a member, remove one, or change a
   member's stage. Saved to STATE.familyOverrides so it survives
   reloads and reimports the same way category edits do. */
function familyMembers(famName){
  return SPECIES.filter(s => s.evoFamily === famName).sort((a,b)=>(a.evoOrder||0)-(b.evoOrder||0) || ((a.dex??99999)-(b.dex??99999)));
}
function saveFamilyEdit(sp){
  STATE.familyOverrides[sp.name] = { evoFamily: sp.evoFamily, evoOrder: sp.evoOrder };
  persist('familyOverrides');
  rebuildBinder();
}
function openFamilyEditor(famName){

  openModal('Edit evolution family', `<div id="famEditorBody">${body()}</div>`, `
    <button class="btn ghost" id="famDoneBtn">Done</button>
    <button class="btn accent" id="famAddConfirmBtn">Add to family</button>
  `);
  wire();
  $('#famDoneBtn').addEventListener('click', () => { closeModal(); render(); });
}
function removeFamilyMember(name, famName){
  const sp = speciesByName.get(name);
  if(!sp) return;
  const others = familyMembers(famName).filter(m=>m.name!==name);
  if(!others.length){ toast("A family needs at least one member — this is already the only one."); return; }
  confirmAction(`Remove ${name} from this family? It'll become its own single-stage entry.`, () => {
    sp.evoFamily = sp.name;
    sp.evoOrder = 1;
    saveFamilyEdit(sp);
    toast(`${name} removed from the family.`);
    openFamilyEditor(famName);
    render();
  });
}
function renderEvolutions(){
  const familiesMap = new Map();
  SPECIES.forEach(s => {
    if(!familiesMap.has(s.evoFamily)) familiesMap.set(s.evoFamily, []);
    familiesMap.get(s.evoFamily).push(s);
  });
  let families = [...familiesMap.entries()].map(([fam, members]) => {
    members = members.slice().sort((a,b)=>(a.evoOrder||0)-(b.evoOrder||0) || ((a.dex??99999)-(b.dex??99999)));
    return { fam, members };
  });
  families.sort((a,b) => (a.members[0].dex??99999) - (b.members[0].dex??99999));

  const q = evolutionsFilter.q ? norm(evolutionsFilter.q) : '';
  const filtered = q ? families.filter(f => f.members.some(m=>norm(m.name).includes(q))) : families;

  const cards = filtered.map(f => {
    const orders = [...new Set(f.members.map(m=>m.evoOrder||1))].sort((a,b)=>a-b);
    const stageGroups = orders.map(o => f.members.filter(m=>(m.evoOrder||1)===o));
    const stagesHTML = stageGroups.map((group, gi) => `
      ${gi>0 ? `<span class="evo-arrow">${ICONS.right}</span>` : ''}
      <div class="evofam-stage">${group.map(evoNodeHTML).join('')}</div>
    `).join('');
    return `<div class="evofam-card">
      <div class="evofam-chain">${stagesHTML}</div>
      <div style="margin-top:8px;text-align:right;">
        <button class="btn ghost sm" data-action="edit-family" data-fam="${esc(f.fam)}">${ICONS.edit} Edit family</button>
      </div>
    </div>`;
  }).join('');

  return `
    <div class="pagehead">
      <div><h1>Evolutions</h1><div class="sub">${fmtInt(families.length)} evolution families · every Pokémon, grouped with what it evolves into or from</div></div>
    </div>
    <div class="toolbar">
      <div class="searchbar">${ICONS.search}<input type="search" id="evoSearch" placeholder="Filter by name…" value="${esc(evolutionsFilter.q)}" autocomplete="off"></div>
    </div>
    <div class="evofam-list">${cards || `<div class="emptystate card">${ICONS.empty}<h3>No matches</h3></div>`}</div>
  `;
}

/* ============================================================
   Binder highlights — mark the pockets whose binder card came in with
   recent imports, so you can see what still has to be added to (or
   changed in) the physical binder. By default that's every import you made
   today, or every import since you last pressed "Mark all as placed".
   You can tick other imports on or off at any time.
   ============================================================ */
function binderHlState(){
  if(!STATE.settings.binderHl) STATE.settings.binderHl = { caughtUpAt:null, on:[], off:[], decided:{} };
  if(!STATE.settings.binderHl.decided) STATE.settings.binderHl.decided = {};
  return STATE.settings.binderHl;
}
function binderHighlightedBatchIds(){
  const st = binderHlState();
  const since = st.caughtUpAt ? new Date(st.caughtUpAt).getTime() : null;
  const todayStr = new Date().toDateString();
  const ids = new Set();
  STATE.history.forEach(b => {
    if(b.cardsDeleted) return;
    const t = new Date(b.date);
    const byDefault = since != null ? t.getTime() > since : t.toDateString() === todayStr;
    if(byDefault) ids.add(b.id);
  });
  (st.on||[]).forEach(id => { if(STATE.history.some(b => b.id===id && !b.cardsDeleted)) ids.add(id); });
  (st.off||[]).forEach(id => ids.delete(id));
  return ids;
}
/* Highlight window. 'imports' = the older way (tick imports by upload time).
   'today' / '7' / '30' / 'date' = by the card's Date Added in your CSV:
   a card is NEW if its Date Added is on/after the window start; a card is UPDATED if an import
   uploaded on/after the window start changed it (quantity or newer Date Added). */
function binderHlWindow(){ return binderHlState().window || '7'; }
function binderHlWindowStart(){
  const st = binderHlState(), w = binderHlWindow();
  if(w === 'imports') return null;
  const d = new Date(); d.setHours(0,0,0,0);
  if(w === 'today') return d;
  if(w === '7'){ d.setDate(d.getDate()-6); return d; }
  if(w === '30'){ d.setDate(d.getDate()-29); return d; }
  if(w === 'date'){ const x = st.sinceDate ? new Date(st.sinceDate + 'T00:00:00') : null; return x && !isNaN(x) ? x : d; }
  return null;
}
function binderHlWindowLabel(){
  const w = binderHlWindow(), st = binderHlWindowStart();
  if(!st) return '';
  const day = fmtDay(st);
  return w === 'today' ? 'Date Added today (' + day + ')' : 'Date Added on or after ' + day;
}
function binderHlItems(){
  const start = binderHlWindowStart();
  if(!start){
    const ids = binderHighlightedBatchIds();
    return collectImportItems(STATE.history.filter(b => ids.has(b.id))).items;
  }
  const t0 = start.getTime();
  const upd = new Set();
  STATE.history.forEach(b => {
    if(b.cardsDeleted) return;
    if(new Date(b.date).getTime() >= t0) (b.updatedIds || []).forEach(id => upd.add(id));
  });
  const out = [];
  STATE.collection.forEach(c => {
    const d = parseDateAdded(c.dateAdded);
    if(d && d.getTime() >= t0) out.push({ card:c, status:'new' });
    else if(upd.has(c.id)) out.push({ card:c, status:'update' });
  });
  return out;
}
/* species name -> 'new' | 'decide' | 'update' | 'imported'.
   new / update / imported: the card sitting in the binder pocket came in with a highlighted import.
   decide: a NEW card came in for a Pokémon that already has a different card in the binder,
   so you may want to swap it in. (Those new cards are kept in binderHlAlts for the tooltip.) */
function binderHighlights(){
  const out = new Map();
  binderHlAlts = new Map();
  const items = binderHlItems();
  if(!items.length) return out;
  const decided = binderHlState().decided || {};
  const alts = new Map();
  const keptExtras = new Set();
  items.forEach(it => {
    const c = it.card;
    if(!c.species) return;
    const pickId = STATE.picks[c.species];
    if(pickId === c.id){
      if(it.status === 'older') return;   // an older card that was just filled in: nothing to place
      out.set(c.species, it.status==='new' ? 'new' : it.status==='update' ? 'update' : 'imported');
    } else if(it.status==='new'){
      // New copy that is not the binder card. No binder card chosen yet, or a swap you haven't decided on: ask.
      // Already decided "keep the current one": it still goes to the extras binder, so mark the pocket as updated.
      if(!pickId || !(decided[c.species]||[]).includes(c.id)){
        if(!alts.has(c.species)) alts.set(c.species, []);
        alts.get(c.species).push(c);
      } else keptExtras.add(c.species);
    }
  });
  alts.forEach((cards, sp) => {
    if(out.get(sp) === 'new') return;   // the binder card itself is new: nothing to decide
    out.set(sp, 'decide');
    binderHlAlts.set(sp, cards);
  });
  keptExtras.forEach(sp => { if(!out.has(sp)) out.set(sp, 'update'); });
  return out;
}
/* "Do I swap the new card in?" — a small chooser opened from the decide icon. */
function openBinderDecideModal(species){
  const items = binderHlItems();
  const newIds = new Set(items.filter(i => i.status==='new').map(i => i.card.id));
  const pickId = STATE.picks[species];
  const cards = cardsForSpecies(species);
  const rows = cards.map(c => `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 0;border-bottom:1px solid var(--line-strong);">
      <div>
        <div class="set">${esc(c.set)} · #${esc(c.cardNumber)}${c.variance?(' · '+esc(c.variance)):''} · ${esc(c.condition)}</div>
        <div class="meta">Qty ${c.quantity}${c.marketPrice?' · $'+Number(c.marketPrice).toFixed(2):''}</div>
        <div style="margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;">${c.id===pickId?'<span class="badge pick">★ In the binder now</span>':''}${newIds.has(c.id)?'<span class="badge new">NEW</span>':''}</div>
      </div>
      ${c.id===pickId ? '' : `<button class="btn sm primary" data-action="binder-decide-pick" data-species="${esc(species)}" data-card="${esc(c.id)}">Put this one in the binder</button>`}
    </div>`).join('');
  openModal(`${species}: which card goes in the binder?`,
    pickId
      ? `<p style="font-size:13.5px;">You already have a card for ${esc(species)} in the binder, and a new one just came in. Pick the one you want in the binder; the others stay in your extras.</p>${rows}`
      : `<p style="font-size:13.5px;">You have new cards for ${esc(species)}, but none is chosen for the binder yet. Pick the one that goes in the binder; the others go to your extras.</p>${rows}`,
    pickId ? `<button class="btn" data-action="binder-decide-keep" data-species="${esc(species)}">Keep the current one</button>` : '');
}
function binderDecideKeep(species){
  binderHighlights();
  const st = binderHlState();
  const seen = new Set(st.decided[species] || []);
  (binderHlAlts.get(species) || []).forEach(c => seen.add(c.id));
  st.decided[species] = [...seen];
  persist('settings');
}
function binderDecidePick(species, cardId){
  if(!STATE.collection.some(c => c.id === cardId && c.species === species)) return;
  STATE.picks[species] = cardId;
  persist('picks');
}
function toggleBinderHighlight(id){
  const st = binderHlState();
  const isOn = binderHighlightedBatchIds().has(id);
  const on = new Set(st.on||[]), off = new Set(st.off||[]);
  if(isOn){ if(on.has(id)) on.delete(id); else off.add(id); }
  else { if(off.has(id)) off.delete(id); else on.add(id); }
  st.on = [...on]; st.off = [...off];
  persist('settings');
}
function markBinderCaughtUp(){
  const st = binderHlState();
  st.caughtUpAt = new Date().toISOString(); st.on = []; st.off = []; st.decided = {};
  persist('settings');
}
function binderHlWindowControlsHTML(){
  const winStart = binderHlWindowStart();
  return `<div class="hl-window" style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
        <span class="import-controls-label">Show as new</span>
        ${[['today','Today'],['7','Last 7 days'],['30','Last 30 days'],['date','Since date…'],['imports','By import']].map(([v,l]) => `<button class="chip ${binderHlWindow()===v?'active':''}" data-action="binder-hl-window" data-value="${v}">${l}</button>`).join('')}
        ${binderHlWindow()==='date' ? `<input type="date" id="binderHlDate" value="${esc(binderHlState().sinceDate || '')}" style="padding:4px 8px;border-radius:8px;border:1px solid var(--line-strong);">` : ''}

/* ============================================================
   Extras Binder — a second binder for every copy beyond each
   species' main-binder pick (duplicates, and any card for a
   species that isn't the chosen pick). Derived on the fly from
   the collection + picks, grouped and ordered the same way the
   main binder's taxonomy is, and auto-paginated 3×3 per page.
   ============================================================ */
function extrasBySpecies(){
  const map = new Map(); // speciesName -> array of { set, cardNumber, cardId } extra copies
  STATE.collection.forEach(c => {
    if(!c.species) return;
    const isPick = STATE.picks[c.species] === c.id;
    const extraQty = isPick ? Math.max(0, (c.quantity||0) - 1) : (c.quantity||0);
    if(extraQty <= 0) return;
    if(!map.has(c.species)) map.set(c.species, []);
    const arr = map.get(c.species);
    for(let i=0;i<extraQty;i++) arr.push({ set:c.set, cardNumber:c.cardNumber, cardId:c.id });
  });
  return map;
}
function extrasLetterOf(name){
  const m = String(name||'').match(/[A-Za-z]/);
  return m ? m[0].toUpperCase() : '#';
}
/* Strict alphabetical layout: one pocket per extra COPY (so 3 extra copies of
   a species means 3 separate pockets, each individually trackable), grouped
   under a letter-header pocket, with a fresh page starting the moment the
   first letter changes — never mid-page. */
function computeExtrasLayout(list, extraMap){
  const rows = [];
  let pocket = 0, page = 1, lastLetter = null;
  function place(row){
    pocket++;
    if(pocket>9){ pocket=1; page++; }
    row.page=page; row.pocket=pocket;
    rows.push(row);
  }
  function forceNewPage(){
    if(pocket!==0){ pocket=0; page++; }
  }
  for(const s of list){
    const letter = extrasLetterOf(s.name);
    if(letter !== lastLetter){
      forceNewPage();
      place({type:'label', display:letter});
      lastLetter = letter;
    }
    const copies = extraMap.get(s.name) || [];
    copies.forEach((copy, i) => {
      place({type:'POKÉMON', species:s, copyIndex:i+1, copyTotal:copies.length, cardInfo:copy});
    });
  }
  return rows;
}

let extrasFilter = { q:'' };
let extrasPage = 1;
function renderExtras(){
  const extraMap = extrasBySpecies();
  let list = SPECIES.filter(s => extraMap.has(s.name));
  if(extrasFilter.q){
    const q = norm(extrasFilter.q);
    list = list.filter(s => norm(s.name).includes(q));
  }
  list = list.slice().sort((a,b)=>a.name.localeCompare(b.name));

  const rows = computeExtrasLayout(list, extraMap);
  const totalPages = rows.length ? rows[rows.length-1].page : 1;
  extrasPage = Math.max(1, Math.min(totalPages, extrasPage||1));
  const pageCells = rows.filter(r=>r.page===extrasPage).sort((a,b)=>a.pocket-b.pocket);
  while(pageCells.length < 9) pageCells.push(null);

  const totalExtraCopies = Array.from(extraMap.values()).reduce((a,arr)=>a+arr.length,0);
  const hlStatus = binderHlCardStatus();

  return `
    <div class="pagehead">
      <div><h1>Extras Binder</h1><div class="sub">${fmtInt(totalExtraCopies)} extra cards across ${fmtInt(list.length)} species · alphabetical, one slot per copy · duplicates &amp; copies not used as your main binder pick</div></div>
    </div>
    <div class="toolbar">
      <div class="searchbar">${ICONS.search}<input type="search" id="extrasSearch" placeholder="Filter extras by Pokémon name…" value="${esc(extrasFilter.q)}"></div>
    </div>
    ${list.length===0 ? `<div class="emptystate card">${ICONS.empty}<h3>No extras yet</h3><p>Copies you own beyond your binder pick — or cards for a species that isn't your pick — show up here automatically.</p></div>` : `
    <div class="binder-toolbar">
      <button class="btn" id="extrasPrev" ${extrasPage<=1?'disabled':''}>${ICONS.left} Prev</button>
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="binder-pagelabel">Page ${extrasPage} of ${totalPages}</span>
        <div class="pager"><input type="number" id="extrasJump" min="1" max="${totalPages}" value="${extrasPage}"><button class="btn sm" id="extrasGo">Go</button></div>
      </div>
      <button class="btn" id="extrasNext" ${extrasPage>=totalPages?'disabled':''}>Next ${ICONS.right}</button>
    </div>
    ${extrasHighlightPanelHTML(rows, hlStatus)}
    <div class="binder-page"><div class="binder-grid">${pageCells.map(c=>renderExtraPocket(c, hlStatus)).join('')}</div></div>
    `}
  `;
}

function statusLabel(s){

function handleImportFile(file){
  const name = file.name.toLowerCase();
  const reader = new FileReader();
  reader.onerror = () => toast('Could not read that file.');
  if(name.endsWith('.csv')){
    reader.onload = e => {
      const arr = parseCSV(String(e.target.result));
      ingestParsedRows(file.name, arr);
    };
    reader.readAsText(file);
  } else if(name.endsWith('.xlsx') || name.endsWith('.xls')){
    reader.onload = e => {
      try{
        const wb = XLSX.read(new Uint8Array(e.target.result), { type:'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const arr = XLSX.utils.sheet_to_json(ws, { header:1, raw:false, defval:'' });
        ingestParsedRows(file.name, arr);
      }catch(err){ console.error(err); toast('Could not parse that spreadsheet.'); }
    };
    reader.readAsArrayBuffer(file);
  } else {
    toast('Please choose a .csv or .xlsx file.');
  }
}
function ingestParsedRows(filename, arrOfArrays){
  if(!arrOfArrays || arrOfArrays.length < 2){ toast('That file looks empty.'); return; }
  const rows = parseCollectrFile(filename, arrOfArrays);
  const portfolios = {};
  rows.forEach(r => { const p = r.portfolio || '(none)'; portfolios[p] = (portfolios[p]||0)+1; });
  let defaultPortfolio = Object.keys(portfolios).find(p => /kyle/i.test(p)) || Object.keys(portfolios)[0] || '';
  importState = { filename, rawRows: rows, portfolios, portfolio: defaultPortfolio, preview:null, manual:{}, cutoff:null };
  render();
}

function buildAndShowPreview(){
  importState.preview = buildImportPreview(importState.rawRows, importState.portfolio, resolveImportCutoff(importState.cutoff));
  render();
}

function doCommitImport(){
  const items = importState.preview.items;
  $$('.review-species-select').forEach(sel => {
    const idx = parseInt(sel.dataset.reviewIdx,10);
    if(sel.value) items[idx].manualSpecies = sel.value;
  });
  $$('.review-skip').forEach(cb => {
    const idx = parseInt(cb.dataset.reviewIdx,10);
    if(cb.checked) items[idx].acceptUnlinked = true;
  });
  const stillUnresolved = items.filter(i => i.status==='review' && !i.manualSpecies && !i.acceptUnlinked);
  if(stillUnresolved.length){
    confirmAction(`${stillUnresolved.length} card(s) still need a species chosen or "keep unlinked" checked. Skip them for now and import the rest?`, () => {
      finishCommit();
    });
    return;
  }
  finishCommit();
}
function finishCommit(){
  const { batch, touchedSpecies } = commitImport(importState.preview, importState.filename, importState.portfolio);
  autoAssignSinglePicks(touchedSpecies);
  toast(`Import complete — ${batch.added} new, ${batch.updated} updated.${batch.older ? ' '+batch.older+' older cards added (not counted as new).' : ''}${batch.heldBack ? ' '+batch.heldBack+' held back (removed in the app, still in Collectr).' : ''}`);
  resetImportState();
  const needsReconcile = speciesNeedingPickReconciliation(touchedSpecies);
  if(needsReconcile.length){
    reconcileQueue = needsReconcile;
    reconcileReturnHash = '#/history/' + batch.id;
    location.hash = '#/reconcile';
  } else {
    location.hash = '#/history/' + batch.id;
  }
}

/* Gather the cards from one or more imports into one de-duplicated list.
   Each entry knows whether the card was NEW or UPDATED and which import it
   came from (the most recent one, if several selected imports touched it).
   Imports made before new-vs-updated tracking only know which cards they
   last touched, so those entries are labelled 'unknown'. */
function collectImportItems(batches){
  const byId = new Map(STATE.collection.map(c => [c.id, c]));
  const merged = new Map();
  let anyUntracked = false;
  const newSpecies = new Set();
  batches.forEach(batch => {
    (batch.newSpecies||[]).forEach(n => newSpecies.add(n));
    const bi = STATE.history.indexOf(batch);
    const tracked = Array.isArray(batch.newIds) || Array.isArray(batch.updatedIds);
    if(!tracked) anyUntracked = true;
    const RANK = { unknown:0, older:1, update:2, new:3 };
    const add = (id, status) => {
      const c = byId.get(id); if(!c) return;
      const ex = merged.get(id);
      if(!ex){ merged.set(id, { card:c, status, batch, batchIndex:bi, order:merged.size }); return; }
      if(RANK[status] > RANK[ex.status]) ex.status = status;
      if(bi < ex.batchIndex){ ex.batch = batch; ex.batchIndex = bi; }
    };
    if(tracked){
      (batch.newIds||[]).forEach(id => add(id,'new'));
      (batch.updatedIds||[]).forEach(id => add(id,'update'));
      (batch.oldIds||[]).forEach(id => add(id,'older'));
    } else {
      STATE.collection.filter(c => c.importBatch === batch.id).forEach(c => add(c.id,'unknown'));
    }
  });
  return { items:[...merged.values()], anyUntracked, newSpecies };
}

/* Where one card ends up: main binder page/pocket, the extras binder, or nowhere yet. */
function cardPlacement(c){
  if(!c.species) return { kind:'nospecies' };
  const slot = binderSlotBySpecies.get(c.species);
  const isPick = STATE.picks[c.species] === c.id;
  if(isPick && slot) return { kind:'main', slot };
  return { kind:'extras', slot };
}
function cardDestinationHTML(c){
  if(!c.species) return `<span class="badge review">Needs species — not in any binder yet</span>`;
  const slot = binderSlotBySpecies.get(c.species);
  const isPick = STATE.picks[c.species] === c.id;
  const extraQty = isPick ? Math.max(0,(c.quantity||0)-1) : (c.quantity||0);
  const bits = [];
  if(isPick){
    bits.push(slot
      ? `<span class="chip sm" data-goto-binder="${slot.page}">${ICONS.binder} Main binder · Pg ${slot.page}, pocket ${slot.pocket}</span>`
      : `<span class="chip sm" style="opacity:.6;">Binder pick (species not in binder)</span>`);
  }
  if(extraQty > 0){
    bits.push(`<span class="chip sm" data-nav="extras">${ICONS.extras} Extras binder${extraQty>1?' ×'+extraQty:''}</span>`);
  }
  if(!isPick && !STATE.picks[c.species]){
    bits.push(`<span class="badge dup">No binder pick set for ${esc(c.species)} yet</span>`);
  }
  return bits.join(' ');
}

function sortImportItems(items, mode){
  const nameOf = i => (i.card.species || i.card.productName || '').toLowerCase();
  const tie = (a,b) => nameOf(a).localeCompare(nameOf(b)) || String(a.card.set||'').localeCompare(String(b.card.set||'')) || String(a.card.cardNumber||'').localeCompare(String(b.card.cardNumber||''), undefined, {numeric:true});
  const arr = items.slice();
  if(mode === 'alpha') arr.sort(tie);
  else if(mode === 'binder'){
    const rank = i => { const p = cardPlacement(i.card); return p.kind==='main' ? 0 : p.kind==='extras' ? 1 : 2; };
    arr.sort((a,b) => {
      const ra = rank(a), rb = rank(b);
      if(ra !== rb) return ra - rb;
      if(ra === 0) return cardPlacement(a.card).slot.slot - cardPlacement(b.card).slot.slot || tie(a,b);
      return tie(a,b);
    });
  } else arr.sort((a,b) => a.batchIndex - b.batchIndex || a.order - b.order); // newest import first
  return arr;
}

function renderImportDetail(ids){
  const batches = ids.map(id => STATE.history.find(b => b.id === id)).filter(Boolean);
  if(!batches.length){
    return `<div class="pagehead"><div><h1>Import not found</h1></div></div>
      <div class="emptystate card">${ICONS.empty}<h3>That import isn't in your history</h3><button class="btn" data-action="view-import-list">Back to import history</button></div>`;
  }
  const multi = batches.length > 1;
  const { items, anyUntracked, newSpecies: newSpeciesSet } = collectImportItems(batches);
  const dupMap = finishDuplicateGroups();
  const pairSet = foilRegularCardIds();
  const nNew = items.filter(i => i.status==='new').length;
  const nUpd = items.filter(i => i.status==='update').length;
  const nUnk = items.filter(i => i.status==='unknown').length;
  const nOld = items.filter(i => i.status==='older').length;
  const nPair = items.filter(i => pairSet.has(i.card.id)).length;
  const nNewPoke = [...new Set(items.filter(i => i.card.species && newSpeciesSet.has(i.card.species)).map(i => i.card.species))].length;
  let shown = items;
  if(importDetailFilter==='new') shown = items.filter(i => i.status==='new');
  if(importDetailFilter==='update') shown = items.filter(i => i.status==='update');
  if(importDetailFilter==='unknown') shown = items.filter(i => i.status==='unknown');
  if(importDetailFilter==='older') shown = items.filter(i => i.status==='older');
  if(importDetailFilter==='pair') shown = items.filter(i => pairSet.has(i.card.id));
  shown = sortImportItems(shown, importDetailSort);
  const allDeleted = batches.every(b => b.cardsDeleted);
  const idList = batches.map(b => b.id).join(',');
  const chip = (attr,val,cur,label) => `<button class="chip ${cur===val?'active':''}" data-action="${attr}" data-value="${val}">${label}</button>`;

  let body;
  if(!shown.length){
    let why = '';
    if(!allDeleted && !items.length && !multi){
      const b0 = batches[0];
      const parts = [];
      if(b0.unchanged) parts.push(`${fmtInt(b0.unchanged)} card${b0.unchanged===1?' was':'s were'} already in your collection with nothing different`);
      if(b0.heldBack) parts.push(`${fmtInt(b0.heldBack)} ${b0.heldBack===1?'was':'were'} held back (removed in the app, still in Collectr)`);
      if(b0.reviewSkipped) parts.push(`${fmtInt(b0.reviewSkipped)} ${b0.reviewSkipped===1?'was':'were'} skipped because no species was chosen`);
      why = `<p style="color:var(--ink-soft);font-size:14px;max-width:520px;margin:6px auto 0;">This import didn\u2019t add or change anything${b0.totalRows ? ' (the file had ' + fmtInt(b0.totalRows) + ' rows' + (b0.inScope!=null && b0.inScope!==b0.totalRows ? ', ' + fmtInt(b0.inScope) + ' in the chosen portfolio' : '') + ')' : ''}. ${parts.length ? esc(parts.join('; ')) + '.' : ''} That usually means this file (or one with the same cards) was already imported. If you expected new cards, check that the right portfolio was chosen and that the cards\u2019 Date Added is on or after your cutoff.</p>`;
    } else if(!allDeleted && items.length && importDetailFilter !== 'all'){
      why = `<p style="color:var(--ink-soft);font-size:14px;margin:6px 0 0;">Nothing matches this filter. Choose <strong>All</strong> above to see every card in this import.</p>`;
    }
    body = `<div class="emptystate card">${ICONS.empty}<h3>${allDeleted ? 'These imports\u2019 cards were deleted' : (!items.length && !multi ? 'Nothing new in this import' : 'No cards to show')}</h3>${why}</div>`;
  } else if(importDetailSort === 'binder'){
    // grouped by binder page so you can work through the binder in order
    const groups = [];
    shown.forEach(it => {
      const p = cardPlacement(it.card);
      const key = p.kind==='main' ? 'p'+p.slot.page : p.kind;
      const label = p.kind==='main' ? 'Binder page '+p.slot.page : p.kind==='extras' ? 'Extras binder (not the binder pick for that species)' : 'Needs a species — not in any binder yet';
      let g = groups[groups.length-1];
      if(!g || g.key !== key){ g = { key, label, rows:[] }; groups.push(g); }
      g.rows.push(it);
    });
    body = groups.map(g => `
      <div class="import-group-head">${esc(g.label)} <span style="font-weight:400;">· ${fmtInt(g.rows.length)}</span></div>
      <div class="cardlist">${g.rows.map(it => renderImportRow(it, multi, dupMap, pairSet, newSpeciesSet)).join('')}</div>`).join('');
  } else {
    body = `<div class="cardlist">${shown.map(it => renderImportRow(it, multi, dupMap, pairSet, newSpeciesSet)).join('')}</div>`;
  }

  return `
    <div class="pagehead">
      <div>
        <h1>${multi ? fmtInt(batches.length)+' imports together' : esc(batches[0].filename||'Import')}</h1>
        <div class="sub">${multi ? '' : esc(new Date(batches[0].date).toLocaleString())+' · '}${fmtInt(nNew)} new · ${fmtInt(nUpd)} updated${nOld ? ` · ${fmtInt(nOld)} older (not new)` : ''}${nUnk ? ` · ${fmtInt(nUnk)} from older imports (no label)` : ''}${nNewPoke ? ` · ${fmtInt(nNewPoke)} new Pokémon` : ''}${allDeleted ? ' · cards deleted' : ''}</div>
      </div>

/* Delete the cards the chosen import(s) added. Cards an import only UPDATED
   already existed before it, so they're kept. */
function deleteImportCards(arg){
  const ids = Array.isArray(arg) ? arg : parseBatchIds(arg);
  const batches = ids.map(id => STATE.history.find(b => b.id === id)).filter(b => b && !b.cardsDeleted);
  if(!batches.length) return;
  const { items, anyUntracked } = collectImportItems(batches);
  const toRemove = items.filter(i => i.status==='new' || i.status==='older' || i.status==='unknown');
  const kept = items.filter(i => i.status==='update').length;
  if(!toRemove.length){ toast('Nothing left to delete from that.'); return; }
  const n = toRemove.length, many = batches.length > 1;
  const msg = anyUntracked
    ? `${many?'Some of these imports were':'This import was'} made before new-vs-updated tracking, so I can\u2019t tell which cards ${many?'were':'was'} already in your collection. Deleting removes ${fmtInt(n)} card${n===1?'':'s'}${kept?' (the ones I do know were only updated, '+fmtInt(kept)+', will be kept)':''}. This can\u2019t be undone.`
    : `Delete the ${fmtInt(n)} card${n===1?'':'s'} ${many?'these imports':'this import'} added?${kept ? ` The ${fmtInt(kept)} card${kept===1?'':'s'} only updated will be kept, since ${kept===1?'it was':'they were'} already in your collection.` : ''} This can\u2019t be undone.`;
  confirmAction(msg + ' Collectr will still have these cards until you delete them there too; they stay listed under Tools until you do, and future imports will skip them.', () => {
    recordAppRemovals(toRemove.map(i => i.card));
    const rm = new Set(toRemove.map(i => i.card.id));
    const species = new Set(toRemove.map(i => i.card.species).filter(Boolean));
    STATE.collection = STATE.collection.filter(c => !rm.has(c.id));
    Object.keys(STATE.picks).forEach(sp => { if(rm.has(STATE.picks[sp])) delete STATE.picks[sp]; });
    batches.forEach(b => { b.cardsDeleted = true; });
    persist('collection'); persist('picks'); persist('history');
    autoAssignSinglePicks(species);
    toast(`${fmtInt(rm.size)} card${rm.size===1?'':'s'} deleted.`);
    render();
  });
}

/* ============================================================
   Cloud sync — optional, free (Firebase Firestore). Nothing here
   runs unless the person pastes in their own Firebase config and
   turns it on; the app is fully local/offline by default.
   ============================================================ */
let firebaseApp = null, firestoreDb = null, unsubscribeSnapshot = null;
let cloudSyncBusy = false, cloudPushTimer = null;
// True whenever this device has local changes that haven't been confirmed
// pushed to the cloud yet. Lets handleRemoteUpdate() tell the difference
// between "safe to silently accept the cloud's version" and "this device
// has changes in flight that a silent overwrite would destroy."
let cloudDirty = false;

function cloudDocRef(){
  if(!firestoreDb || !STATE.settings.cloudSync || !STATE.settings.cloudSync.syncCode) return null;
  const code = norm(STATE.settings.cloudSync.syncCode).replace(/\s+/g,'-');
  return firestoreDb.collection('kylesDeckSync').doc(code);
}
function loadFirebaseSdk(){
  if(window.firebase && window.firebase.firestore) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const s1 = document.createElement('script');
    s1.src = 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js';
    s1.onload = () => {
      const s2 = document.createElement('script');
      s2.src = 'https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js';
      s2.onload = () => resolve();
      s2.onerror = () => reject(new Error('could not load the cloud sync library — check your connection'));
      document.head.appendChild(s2);
    };
    s1.onerror = () => reject(new Error('could not load the cloud sync library — check your connection'));
    document.head.appendChild(s1);
  });
}
async function connectCloudSync(configText, syncCode){
  let config;
  try{ config = JSON.parse(configText); }
  catch(e){ toast('That doesn\'t look like valid Firebase config JSON — paste the whole { … } object.'); return false; }
  if(!syncCode || !syncCode.trim()){ toast('Enter a sync code first — any private word or phrase works, as long as every device uses the same one.'); return false; }
  try{
    await loadFirebaseSdk();
    firebaseApp = (window.firebase.apps && window.firebase.apps.length) ? window.firebase.app() : window.firebase.initializeApp(config);
    firestoreDb = window.firebase.firestore();
  }catch(e){
    toast('Could not connect: ' + e.message);
    return false;
  }
  STATE.settings.cloudSync = { enabled:true, syncCode: syncCode.trim(), config, lastPushedAt: STATE.settings.cloudSync?.lastPushedAt || 0 };
  persist('settings');
  try{
    await pullThenWatch();
  }catch(e){
    toast('Connected, but the first sync failed — will keep retrying: ' + e.message);
  }
  toast('Cloud sync connected.');
  return true;
}
async function pullThenWatch(){
  const ref = cloudDocRef();
  if(!ref) return;
  try{
    const snap = await ref.get();
    if(snap.exists){
      const remote = snap.data();
      if((remote.updatedAt||0) > (STATE.settings.cloudSync.lastPushedAt||0)) handleRemoteUpdate(remote);
    } else {
      await pushToCloud();
    }
  }catch(e){
    toast('Cloud sync: could not reach the server — will keep trying in the background.');
  }
  watchCloud();
}
// A newer update landed from another device. If this device has no
// unsynced local changes of its own, it's safe to just take it (the old
// behavior). If this device DOES have changes still in flight, silently
// overwriting them would lose real edits — so ask instead of guessing.
function handleRemoteUpdate(remote){
  if(!cloudDirty){ applyRemoteState(remote); return; }
  openModal('Cloud sync conflict', `
    <p>This device has changes that haven't finished syncing yet, and another device just pushed newer data to the cloud.</p>
    <p>Loading the cloud's version will discard this device's unsynced changes. Keeping this device's version will overwrite the cloud with what's here instead.</p>
  `, `
    <button class="btn ghost" id="cloudConflictKeepLocal">Keep this device's changes</button>
    <button class="btn accent" id="cloudConflictLoadRemote">Load cloud's version</button>
  `);
  $('#cloudConflictLoadRemote').addEventListener('click', () => { closeModal(); cloudDirty = false; applyRemoteState(remote); });
  $('#cloudConflictKeepLocal').addEventListener('click', () => { closeModal(); pushToCloud(); });
}
function applyRemoteState(remote){
  STATE.collection = remote.collection || [];
  STATE.picks = remote.picks || {};
  STATE.history = remote.history || [];
  STATE.overrides = remote.overrides || {};
  STATE.collectrSnapshot = remote.collectrSnapshot || null;
  STATE.removedInApp = remote.removedInApp || {};
  const keepCloudSync = STATE.settings.cloudSync;
  STATE.settings.cloudSync = keepCloudSync;
  STATE.settings.cloudSync.lastPushedAt = remote.updatedAt || Date.now();
  Object.keys(LS_KEYS).forEach(k => persist(k));
  toast('Synced the latest data from the cloud.');
  render();
}
function watchCloud(){
  const ref = cloudDocRef();
  if(!ref) return;
  if(unsubscribeSnapshot) unsubscribeSnapshot();
  unsubscribeSnapshot = ref.onSnapshot(snap => {
    if(!snap.exists) return;
    const remote = snap.data();
    if((remote.updatedAt||0) > (STATE.settings.cloudSync.lastPushedAt||0) && !cloudSyncBusy) handleRemoteUpdate(remote);
  }, err => console.error('cloud watch error', err));
}
function scheduleCloudPush(){
  if(!STATE.settings.cloudSync || !STATE.settings.cloudSync.enabled) return;
  clearTimeout(cloudPushTimer);
  cloudPushTimer = setTimeout(pushToCloud, 1200);
}
async function pushToCloud(){
  const ref = cloudDocRef();
  if(!ref) return;
  cloudSyncBusy = true;
  const now = Date.now();
  const payload = {
    collection: STATE.collection, picks: STATE.picks, history: STATE.history, overrides: STATE.overrides,
    collectrSnapshot: STATE.collectrSnapshot || null, removedInApp: STATE.removedInApp || {},
    updatedAt: now,
  };
  try{
    await ref.set(payload);
    STATE.settings.cloudSync.lastPushedAt = now;
    cloudDirty = false;
    persist('settings');
  }catch(e){
    console.error('cloud push failed', e);
  }
  cloudSyncBusy = false;
}
function disconnectCloudSync(){
  if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot=null; }
  STATE.settings.cloudSync = { enabled:false, syncCode:'', config:null };
  persist('settings');
  toast('Cloud sync turned off. Your data stays right here on this device.');
  render();
}
function showCloudSyncHelp(){
  openModal('Getting a free Firebase config', `
    <ol style="padding-left:18px;line-height:1.8;font-size:13.5px;">
      <li>Go to <strong>console.firebase.google.com</strong> and sign in with any Google account.</li>
      <li>Click <strong>Add project</strong>, give it any name (e.g. "kyles-deck"), and finish the wizard — you can turn off Google Analytics.</li>
      <li>On the project overview page, click the <strong>&lt;/&gt;</strong> (web) icon to register a new web app. Any nickname is fine.</li>
      <li>Firebase shows a <code>firebaseConfig</code> object. Copy the whole <code>{ … }</code> and paste it into the box here.</li>
      <li>In the left sidebar go to <strong>Build → Firestore Database → Create database</strong>. Start in <strong>test mode</strong> and pick any region.</li>
      <li>That's it for setup — every device just needs this same config plus the same sync code, entered once here in Settings.</li>
    </ol>
    <p style="font-size:12.5px;color:var(--ink-soft);margin-top:12px;">
      Test mode opens the database for 30 days. For something that keeps working after that, open the <strong>Rules</strong> tab
      in Firestore and replace them with this — it only allows access to a document whose name is your exact sync code,
      so nobody can browse anyone else's data without knowing it (this is convenience, not bank-grade security — treat
      your sync code like a shared password):
    </p>
    <pre style="background:var(--paper-sunken);padding:10px;border-radius:6px;font-size:11.5px;overflow-x:auto;white-space:pre-wrap;">rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /kylesDeckSync/{syncCode} {
      allow read, write: if true;
    }
  }
}</pre>
  `, `<button class="btn primary" data-action="close-modal">Got it</button>`);
}
// Reconnect automatically on load if cloud sync was already turned on.
if(STATE.settings.cloudSync && STATE.settings.cloudSync.enabled && STATE.settings.cloudSync.config){
  connectCloudSync(JSON.stringify(STATE.settings.cloudSync.config), STATE.settings.cloudSync.syncCode).catch(()=>{});
}

function renderSettings(){
  const cs = STATE.settings.cloudSync || { enabled:false, syncCode:'', config:null };
  return `
    <div class="pagehead"><div><h1>Settings</h1></div></div>
    <div class="panel" style="margin-bottom:16px;">
      <div class="section-title" style="margin-top:0;">Storage</div>
      <p style="color:var(--ink-soft);font-size:13px;">${window.__KV_MODE === 'idb'
        ? 'Your data is saved in this browser\u2019s database (IndexedDB), which has far more room than the small storage older versions used.'
        : 'Your data is saved in this browser\u2019s small storage (about 5 MB, shared with every app on the same web address). If saving ever fails, download a backup below.'}
        This app\u2019s data is about <strong>${fmtInt(Math.round(storageUsageChars()/1024))} KB</strong>.</p>
      <p style="font-size:13px;margin:8px 0;"><strong>Saved here right now:</strong> ${fmtInt(STATE.collection.length)} cards · ${fmtInt(STATE.history.length)} imports · ${fmtInt(Object.keys(STATE.categoryOverrides).length)} Pokémon you recategorized · ${fmtInt(Object.keys(STATE.labelOverrides).length + Object.keys(STATE.mergedLabels).length)} edited binder labels · ${fmtInt(Object.keys(STATE.familyOverrides).length)} evolution-family edits · ${fmtInt(STATE.customSpecies.length)} Pokémon you added by hand.</p>
      <button class="btn" id="checkStorageBtn">Check storage space</button>
    </div>
    <div class="panel" style="margin-bottom:16px;">
      <div class="section-title" style="margin-top:0;">Backup &amp; export</div>
      <p style="color:var(--ink-soft);font-size:13px;">Your collection, binder picks, and import history all live in this browser${cs.enabled ? ', and are synced to your cloud sync code' : ''}. Back them up regularly, especially before clearing browser data.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;">
        <button class="btn primary" id="exportBackupBtn">Download full backup (.json)</button>
        <button class="btn" id="exportCsvBtn">Export collection (.csv)</button>
        <button class="btn" id="exportTaxCsvBtn">Export categorization list (.csv)</button>
      </div>
    </div>
    ${(() => { const ids = Object.keys(STATE.settings.deletedSpecies || {}).filter(id => ORIGINAL_NAMES.has(id)); return ids.length ? `
    <div class="panel" style="margin-bottom:16px;">
      <div class="section-title" style="margin-top:0;">Deleted Pokémon</div>
      <p style="color:var(--ink-soft);font-size:13px;">Restoring one puts it back in the Pokédex and binder. Cards you moved off it stay where they are.</p>
      <div style="display:flex;flex-direction:column;gap:6px;margin-top:8px;">${ids.map(id => `<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;"><span>${esc(ORIGINAL_NAMES.get(id))}</span><button class="btn sm" data-action="restore-species" data-id="${esc(id)}">Restore</button></div>`).join('')}</div>
    </div>` : ''; })()}
    <div class="panel" style="margin-bottom:16px;">
      <div class="section-title" style="margin-top:0;">Restore backup</div>
      <p style="color:var(--ink-soft);font-size:13px;">Restoring replaces everything currently in this app with the contents of the backup file.</p>
      <button class="btn" id="restoreBackupBtn">Choose backup file…</button>
      <input type="file" id="restoreInput" accept=".json" class="hidden">
    </div>
    <div class="panel" style="margin-bottom:16px;">
      <div class="section-title" style="margin-top:0;">Cloud sync <span style="font-weight:400;color:var(--ink-soft);font-size:12px;">(optional)</span></div>
      <p style="color:var(--ink-soft);font-size:13px;">Keep this collection in sync across your devices — put the same sync code + config on each one. Runs on a free Firebase project (about 5 minutes to set up once; free tier is enormous for a collection this size, so storage isn't something to worry about even with photos in the mix, since artwork is pulled live from the web rather than stored). If two devices make changes around the same time, the one that finishes syncing last normally wins — if this device still has unsynced changes when that happens, you'll be asked which version to keep instead of one silently overwriting the other.</p>
      <div style="display:flex;align-items:center;gap:8px;margin:12px 0;font-size:13px;">
        ${cs.enabled
          ? `<span class="dot owned"></span> Connected — syncing as <strong>${esc(cs.syncCode)}</strong>`
          : `<span class="dot" style="background:var(--line-strong);"></span> Not connected — this device only`}
      </div>
      ${!cs.enabled ? `
      <div class="field"><label>Sync code — keep this private, it's shared like a password</label>
        <input type="text" id="csCode" placeholder="e.g. kyle-scottie-binder-2026" value="${esc(cs.syncCode||'')}"></div>
      <div class="field"><label>Firebase web app config — paste the whole object from your Firebase console</label>
        <textarea id="csConfig" rows="5" placeholder='{"apiKey":"…","projectId":"…", …}'></textarea></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn primary" id="csConnectBtn">${ICONS.cloud} Connect cloud sync</button>
        <button class="btn ghost" id="csHelpBtn">How do I get a Firebase config?</button>
      </div>` : `
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn" id="csPushBtn">Push this device's data to the cloud</button>
        <button class="btn" id="csPullBtn">Pull latest from the cloud</button>
        <button class="btn accent" id="csDisconnectBtn">${ICONS.cloudOff} Turn off cloud sync</button>
      </div>`}
    </div>
    ${renderCategoryManager()}
    <div class="panel">
      <div class="section-title" style="margin-top:0;">Reset</div>
      <p style="color:var(--ink-soft);font-size:13px;">Permanently erase all cards, binder picks, and import history from this browser${cs.enabled ? ' and from the cloud sync code above' : ''}.</p>
      <button class="btn accent" id="resetAllBtn">${ICONS.trash} Erase all data</button>
    </div>
  `;
}
function downloadFile(filename, content, type){
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function exportBackup(){
  const data = { exportedAt: new Date().toISOString(), version:1, ...STATE };
  downloadFile(`kyles-deck-backup-${todayISO()}.json`, JSON.stringify(data,null,2), 'application/json');
}
function exportCollectionCSV(){
  const headers = ['Species','Set','Card Number','Rarity','Variance','Grade','Condition','Cost Paid','Market Price','Quantity','Date Added','Binder Pick','Notes'];
  const lines = [headers.join(',')];
  STATE.collection.forEach(c => {
    const isPick = c.species && STATE.picks[c.species]===c.id;
    const row = [c.species||c.productName, c.set, c.cardNumber, c.rarity, c.variance, c.grade, c.condition, c.costPaid, c.marketPrice, c.quantity, c.dateAdded, isPick?'Yes':'No', c.notes]
      .map(v => `"${String(v==null?'':v).replace(/"/g,'""')}"`);
    lines.push(row.join(','));
  });
  downloadFile(`kyles-deck-collection-${todayISO()}.csv`, lines.join('\n'), 'text/csv');
}
function exportCategorizationCSV(){
  const headers = ['Species','Dex #','Group','Category','Subcategory','Evolution Family','Evolution Stage','Owned','Binder Page'];
  const lines = [headers.join(',')];
  SPECIES.slice()
    .sort((a,b)=> (a.dex??99999)-(b.dex??99999) || a.name.localeCompare(b.name))
    .forEach(s => {
      const slot = binderSlotBySpecies.get(s.name);
      const row = [
        s.name,
        s.dex!=null ? s.dex : '',
        s.group||'',
        s.category||'',
        s.subcategory||'',
        s.evoFamily||'',
        s.evoOrder!=null ? s.evoOrder : '',
        isOwned(s.name) ? 'Yes' : 'No',
        slot ? slot.page : '',
      ].map(v => `"${String(v==null?'':v).replace(/"/g,'""')}"`);
      lines.push(row.join(','));
    });
  downloadFile(`kyles-deck-categorization-${todayISO()}.csv`, lines.join('\n'), 'text/csv');
}
function restoreBackup(file){
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const data = JSON.parse(e.target.result);
      confirmAction('Replace all current data with this backup?', () => {
        STATE = {
          collection: data.collection||[], picks: data.picks||{}, history: data.history||[],
          overrides: data.overrides||{}, settings: data.settings||{},
          labelOverrides: data.labelOverrides||{}, mergedLabels: data.mergedLabels||{},
          categoryOverrides: data.categoryOverrides||{},
          manualOwned: data.manualOwned||{},
          taxonomy: data.taxonomy || { groups: JSON.parse(JSON.stringify(DEFAULT_GROUP_ORDER)), categories: JSON.parse(JSON.stringify(DEFAULT_CATEGORY_ORDER)), subcategories: JSON.parse(JSON.stringify(DEFAULT_SUBCATEGORY_ORDER)) },
          familyOverrides: data.familyOverrides||{},
          customSpecies: data.customSpecies||[],
          collectrSnapshot: data.collectrSnapshot||null,
          removedInApp: data.removedInApp||{},
        };
        GROUP_ORDER = STATE.taxonomy.groups;
        CATEGORY_ORDER = STATE.taxonomy.categories;
        SUBCATEGORY_ORDER = STATE.taxonomy.subcategories;
        Object.keys(LS_KEYS).forEach(k => persist(k));
        STATE.customSpecies.forEach(sp => {
          if(sp && sp.name && !speciesByName.has(sp.name)){
            SPECIES.push(sp);
            speciesByName.set(sp.name, sp);
          }
        });
        applySpeciesDeletions();
        applySpeciesRenames();
        Object.keys(STATE.categoryOverrides).forEach(nm => {
          const sp = SPECIES.find(s => s.name === nm);
          const ov = STATE.categoryOverrides[nm];
          if(sp && ov) Object.assign(sp, ov);
        });
        Object.keys(STATE.familyOverrides).forEach(nm => {
          const sp = SPECIES.find(s => s.name === nm);
          const ov = STATE.familyOverrides[nm];
          if(sp && ov) Object.assign(sp, ov);
        });
        rebuildBinder();
        toast('Backup restored.');
        location.hash = '#/dashboard'; render();
      });
    }catch(err){ toast('That file could not be read as a backup.'); }
  };
  reader.readAsText(file);
}

// Boot: the first render happens last, after every variable above has been declared,
// so reloading the app while sitting on any page (the Binder, Pokédex, Import...) can't hit an
// uninitialised variable and stop the app from starting.
render();
</script>
<script>
/* Loader: opens the browser database, moves any data an older version kept in
   localStorage over to it (checking it copied correctly before removing the old
   copy, which also frees space other apps on this web address were sharing), then
   starts the app. If the database isn't available, the app starts in localStorage mode. */
(function(){
  var DB_NAME = 'kylesdeck', STORE = 'kv';
  function openDB(){
    return new Promise(function(res, rej){
      if(!window.indexedDB) return rej(new Error('IndexedDB not available'));
      var r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore(STORE); };
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ rej(r.error || new Error('open failed')); };
      r.onblocked = function(){ rej(new Error('open blocked')); };
    });
  }
  function readAll(db){
    return new Promise(function(res, rej){
      var out = {}, tx = db.transaction(STORE, 'readonly'), req = tx.objectStore(STORE).openCursor();
      req.onsuccess = function(){ var c = req.result; if(c){ out[c.key] = c.value; c.continue(); } else res(out); };
      req.onerror = function(){ rej(req.error || new Error('read failed')); };
    });
  }
  function writeMany(db, entries){
    return new Promise(function(res, rej){
      var tx = db.transaction(STORE, 'readwrite'), st = tx.objectStore(STORE);
      Object.keys(entries).forEach(function(k){ st.put(entries[k], k); });
      tx.oncomplete = function(){ res(); };
      tx.onerror = tx.onabort = function(){ rej(tx.error || new Error('write failed')); };
    });
  }
  function lsKeys(){
    var ks = [];
    try{ for(var i = 0; i < localStorage.length; i++){ var k = localStorage.key(i); if(k && k.indexOf('pkmn.') === 0) ks.push(k); } }catch(e){}
    return ks;
  }
  function setMode(mode, kv, db){ window.__KV_MODE = mode; window.__KV = kv || {}; window.__IDB = db || null; }
  function startApp(){
    var el = document.createElement('script');
    el.textContent = document.getElementById('kd-app').textContent;
    document.body.appendChild(el);
  }
  (async function(){
    try{
      var db = await openDB();
      var kv = await readAll(db);
      var dirty = false;
      try{ dirty = localStorage.getItem('pkmn.__lsdirty') === '1'; }catch(e){}
      var mig = {};
      lsKeys().forEach(function(k){
        if(k === 'pkmn.__lsdirty') return;
        if(dirty || !(k in kv)){ var v = localStorage.getItem(k); if(v != null) mig[k] = v; }
      });
      if(Object.keys(mig).length){
        await writeMany(db, mig);
        var back = await readAll(db);
        Object.keys(mig).forEach(function(k){ if(back[k] !== mig[k]) throw new Error('copy could not be verified'); });
        kv = back;
      }
      // everything that was in localStorage is now safely in the database: free that space
      try{ lsKeys().forEach(function(k){ if(k === 'pkmn.__lsdirty' || (k in kv)) localStorage.removeItem(k); }); }catch(e){}
      setMode('idb', kv, db);
      try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
    }catch(e){
      console.warn('IndexedDB unavailable, using localStorage instead', e);
      setMode('local', null, null);
    }
    startApp();
  })();
})();
</script>
